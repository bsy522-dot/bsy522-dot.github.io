<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>학원파인더 — 전국 학원·교습소 찾기</title>
<meta name="description" content="나이스(NEIS) 교육정보 개방 포털의 학원교습소정보로 만든 전국 학원·교습소 디렉토리. 내 주변·시도·시군구·읍면동으로 찾고 전화번호·교습과정·공개 수강료를 확인합니다.">
<meta name="theme-color" content="#0b1220">
<meta name="color-scheme" content="dark light">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta property="og:type" content="website">
<meta property="og:title" content="학원파인더 — 전국 학원·교습소 찾기">
<meta property="og:description" content="교육부·시도교육청 공개데이터 기반 전국 학원·교습소 디렉토리">
<style>
  :root{
    --bg:#0b1220; --surface:#111a2b; --surface-2:#17233a; --line:#243352;
    --fg:#e8eefc; --fg-dim:#9fb0d0; --fg-mute:#6d7f9f;
    --accent:#a78bfa; --accent-fg:#241452; --accent-soft:rgba(167,139,250,.15);
    --ok:#34d399; --warn:#fbbf24; --info:#60a5fa; --void:#94a3b8;
    --call:#22c55e; --call-fg:#052e16;
    --radius:14px; --shadow:0 8px 28px rgba(0,0,0,.38);
  }
  html[data-theme="light"]{
    --bg:#f5f7fc; --surface:#ffffff; --surface-2:#eef2fa; --line:#d8e0ef;
    --fg:#131a2b; --fg-dim:#4a5670; --fg-mute:#6f7c95;
    --accent:#6d4bd8; --accent-fg:#ffffff; --accent-soft:rgba(109,75,216,.10);
    --ok:#0f8a5f; --warn:#a86500; --info:#1d63c9; --void:#66748e;
    --call:#12833f; --call-fg:#ffffff;
    --shadow:0 6px 22px rgba(20,30,60,.10);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--fg);
    font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI","Malgun Gothic",
         "Apple SD Gothic Neo","Noto Sans KR",sans-serif;
    -webkit-text-size-adjust:100%;
  }
  a{color:var(--accent)}
  button,select,input{font:inherit;color:inherit}
  .wrap{max-width:1180px;margin:0 auto;padding:0 14px}

  /* ── 헤더 ─────────────────────────────────────── */
  header{
    position:sticky;top:0;z-index:40;background:var(--bg);
    border-bottom:1px solid var(--line);
    padding-top:env(safe-area-inset-top);
  }
  .hd{display:flex;align-items:center;gap:10px;padding:11px 0}
  .logo{
    width:34px;height:34px;border-radius:9px;background:var(--accent);
    color:var(--accent-fg);display:grid;place-items:center;
    font-weight:800;font-size:17px;flex:none;
  }
  .ttl{font-weight:800;font-size:18px;letter-spacing:-.2px}
  .sub{font-size:12px;color:var(--fg-mute);margin-top:1px}
  .spacer{flex:1}
  .iconbtn{
    background:var(--surface-2);border:1px solid var(--line);color:var(--fg-dim);
    border-radius:10px;min-width:38px;height:38px;padding:0 9px;cursor:pointer;font-size:16px;
  }
  .iconbtn:hover{color:var(--fg);border-color:var(--accent)}

  /* ── 필터 ─────────────────────────────────────── */
  #filters[hidden]{display:none}
  /* 폭 기준을 px 가 아니라 em 으로 잡는다 — 글자를 1.5배로 키우면 칸이 저절로
     한 줄씩 내려가서 "서울특별시 (25," 처럼 잘리지 않는다 (감사 C5) */
  .bar{display:grid;gap:8px;padding:0 0 9px;
       grid-template-columns:repeat(auto-fit,minmax(min(100%,11em),1fr))}
  .bar.qrow{grid-template-columns:1fr auto}
  .advbtn{padding:9px 14px;min-height:40px;white-space:nowrap}
  .advbtn[aria-expanded="true"]{border-color:var(--accent);color:var(--fg)}
  .advbtn .n{
    display:inline-block;margin-left:5px;background:var(--accent);color:var(--accent-fg);
    border-radius:999px;padding:0 6px;font-size:12px;font-weight:800;
  }
  #adv[hidden]{display:none}
  .field{position:relative;display:flex;align-items:center;min-width:0}
  select,.searchbox input{
    background:var(--surface);border:1px solid var(--line);border-radius:10px;
    padding:9px 11px;min-height:40px;outline:none;
  }
  /* 1.5배 글자확대에서도 안 잘리게 — 고정 max-width 금지 (감사 C5) */
  select{cursor:pointer;width:100%;min-width:0;max-width:100%}
  select:focus,.searchbox input:focus{border-color:var(--accent)}
  .searchbox{min-width:0;display:flex}
  .searchbox input{width:100%;min-width:0}
  .chip{
    background:var(--surface);border:1px solid var(--line);color:var(--fg-dim);
    border-radius:999px;padding:6px 12px;font-size:.85em;cursor:pointer;
    white-space:nowrap;
  }
  .chip[aria-pressed="true"]{
    background:var(--accent-soft);border-color:var(--accent);
    color:var(--fg);font-weight:600;
  }
  .chip:hover{border-color:var(--accent)}
  .chip.warnish[aria-pressed="true"]{
    background:color-mix(in srgb,var(--warn) 16%,transparent);border-color:var(--warn);
  }

  .frow{display:flex;align-items:flex-start;gap:8px;padding:0 0 8px}
  .frow .lbl{flex:none;font-size:.82em;color:var(--fg-mute);padding:7px 0 0;min-width:34px}
  .frow .chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
  .subrow{margin:-3px 0 9px 42px;display:flex;flex-wrap:wrap;gap:6px}
  .chip.sub{font-size:.79em;padding:4.5px 10px}
  .hint-est{font-size:11px;color:var(--fg-mute);padding:0 0 9px 42px;
            overflow-wrap:anywhere;word-break:keep-all}

  /* ── 상태줄 ───────────────────────────────────── */
  .status{
    display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;
    padding:12px 0 8px;font-size:.85em;color:var(--fg-dim);
  }
  .status b{color:var(--fg);font-size:1.15em}
  .locbar{
    display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:10px 0 0;
    padding:9px 12px;border-radius:10px;background:var(--accent-soft);
    border:1px solid var(--accent);font-size:13px;color:var(--fg-dim);
  }

  /* ── 목록 ─────────────────────────────────────── */
  .grid{display:grid;gap:9px;grid-template-columns:1fr;padding-bottom:22px}
  @media(min-width:720px){.grid{grid-template-columns:1fr 1fr}}
  @media(min-width:1040px){.grid{grid-template-columns:1fr 1fr 1fr}}
  .card{
    background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
    display:flex;align-items:stretch;overflow:hidden;
  }
  .card:hover{border-color:var(--accent)}
  .cardmain{
    background:none;border:0;padding:13px 12px 13px 14px;cursor:pointer;text-align:left;
    flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:6px;
  }
  .card h3{margin:0;font-size:.97em;line-height:1.35;font-weight:700;
           word-break:keep-all;overflow-wrap:anywhere}
  .card .addr{font-size:.82em;color:var(--fg-dim);
              overflow-wrap:anywhere;word-break:keep-all}
  .call{
    flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:2px;text-decoration:none;padding:0 13px;min-width:62px;
    background:var(--surface-2);border-left:1px solid var(--line);
    color:var(--call);font-size:11.5px;font-weight:700;
  }
  .call .ic{font-size:17px;line-height:1}
  .call:hover{background:var(--call);color:var(--call-fg)}
  .tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:1px}
  .tag{
    font-size:.72em;padding:2.5px 8px;border-radius:999px;
    background:var(--surface-2);color:var(--fg-dim);border:1px solid var(--line);
    white-space:nowrap;
  }
  .tag.k{background:var(--accent-soft);border-color:var(--accent);color:var(--fg)}
  .tag.fee{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 45%,transparent)}
  .tag.rest{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 45%,transparent)}
  .tag.dorm{color:var(--info);border-color:color-mix(in srgb,var(--info) 45%,transparent)}
  .tag.tel{color:var(--call);border-color:color-mix(in srgb,var(--call) 45%,transparent)}

  .more{margin:0 auto 26px;display:block}
  .btn{
    background:var(--surface-2);border:1px solid var(--line);color:var(--fg);
    border-radius:10px;padding:10px 18px;cursor:pointer;
  }
  .btn:hover{border-color:var(--accent)}
  .btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent);font-weight:700}
  .btn.call{background:var(--call);color:var(--call-fg);border-color:var(--call);
            font-weight:800;flex-direction:row;gap:8px;padding:12px 18px;min-width:0}
  .btn.call:hover{opacity:.9}

  .empty{padding:34px 10px;text-align:center;color:var(--fg-mute)}
  .empty p{margin:6px 0}
  .empty .fixes{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;margin-top:14px}

  /* ── 지역 고르기(첫 화면) ─────────────────────── */
  .pickwrap{padding:10px 0 26px}
  .pickwrap h2{font-size:17px;margin:0 0 4px;font-weight:800}
  .pickwrap .lede{font-size:13.5px;color:var(--fg-mute);margin:0 0 14px}
  .nearbtn{
    width:100%;display:flex;align-items:center;gap:11px;text-align:left;
    background:var(--accent);color:var(--accent-fg);border:0;border-radius:13px;
    padding:15px 16px;font-size:15.5px;font-weight:800;cursor:pointer;margin-bottom:9px;
  }
  .nearbtn .ic{font-size:20px}
  .nearbtn small{display:block;font-weight:600;opacity:.82;font-size:12px;margin-top:2px}
  .nearbtn[disabled]{opacity:.6;cursor:progress}
  .recent{
    width:100%;display:flex;align-items:center;gap:9px;text-align:left;
    background:var(--surface);border:1px solid var(--line);border-radius:13px;
    padding:13px 15px;cursor:pointer;margin-bottom:16px;color:var(--fg);
  }
  .recent:hover{border-color:var(--accent)}
  .recent b{font-weight:700}
  .geoerr{font-size:12.5px;color:var(--warn);margin:0 0 12px}
  .picksearch{width:100%;margin:0 0 11px}
  .sidogrid{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
  .sidobtn{
    background:var(--surface);border:1px solid var(--line);border-radius:12px;
    padding:13px;cursor:pointer;text-align:left;color:var(--fg);
  }
  .sidobtn:hover{border-color:var(--accent);background:var(--accent-soft)}
  .sidobtn .nm{font-weight:700;font-size:15px}
  .sidobtn .ct{font-size:12.5px;color:var(--fg-mute);margin-top:2px}
  .sidobtn .alias{font-size:11.5px;color:var(--warn);margin-top:3px}
  .backlink{background:none;border:0;color:var(--fg-dim);cursor:pointer;
            padding:6px 0;font-size:13.5px}
  .backlink:hover{color:var(--accent)}

  /* ── 상세 시트 ────────────────────────────────── */
  .backdrop{
    position:fixed;inset:0;background:rgba(4,8,18,.62);z-index:60;
    display:none;align-items:flex-end;justify-content:center;
  }
  .backdrop.on{display:flex}
  @media(min-width:720px){.backdrop.on{align-items:center}}
  .sheet{
    background:var(--surface);width:100%;max-width:620px;max-height:88vh;overflow:auto;
    border-radius:18px 18px 0 0;padding:18px 18px calc(20px + env(safe-area-inset-bottom));
    box-shadow:var(--shadow);
  }
  @media(min-width:720px){.sheet{border-radius:18px}}
  .sheet h2{margin:0 6px 2px 0;font-size:19px;line-height:1.35;
            word-break:keep-all;overflow-wrap:anywhere}
  .sheethd{display:flex;align-items:flex-start;gap:10px}
  .acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
  .acts .btn{flex:1 1 auto;text-align:center;text-decoration:none;
             display:flex;align-items:center;justify-content:center;gap:7px}
  .dl{margin:14px 0 0;display:grid;grid-template-columns:minmax(72px,92px) 1fr;gap:8px 12px;font-size:14.5px}
  .dl dt{color:var(--fg-mute);font-size:13.5px}
  .dl dd{margin:0;overflow-wrap:anywhere;word-break:keep-all}
  .feelist{margin:6px 0 0;padding:0;list-style:none;display:grid;gap:4px}
  .feelist li{display:flex;justify-content:space-between;gap:12px;
              border-bottom:1px dashed var(--line);padding-bottom:3px;font-size:14px}
  .feelist .amt{color:var(--ok);font-weight:600;white-space:nowrap}
  .maplinks{display:flex;flex-wrap:wrap;gap:7px;margin-top:8px}
  .maplinks a{
    text-decoration:none;background:var(--surface-2);border:1px solid var(--line);
    color:var(--fg-dim);border-radius:9px;padding:8px 13px;font-size:13.5px;
  }
  .maplinks a:hover{border-color:var(--accent);color:var(--fg)}
  .seclbl{font-size:13px;color:var(--fg-mute);margin-top:16px}
  .notice{
    margin-top:16px;padding:11px 12px;border-radius:10px;background:var(--surface-2);
    border:1px solid var(--line);font-size:12.5px;color:var(--fg-mute);line-height:1.6;
  }
  .notice b{color:var(--fg-dim)}

  footer{
    border-top:1px solid var(--line);margin-top:8px;
    padding:18px 0 calc(26px + env(safe-area-inset-bottom));
    font-size:12.5px;color:var(--fg-mute);line-height:1.7;
  }
  footer a{color:var(--fg-dim)}
  .loading{padding:36px;text-align:center;color:var(--fg-mute)}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
  .toast{
    position:fixed;left:50%;transform:translateX(-50%);bottom:26px;z-index:80;
    background:var(--surface-2);border:1px solid var(--accent);color:var(--fg);
    border-radius:10px;padding:10px 16px;font-size:13.5px;box-shadow:var(--shadow);
  }
</style>
</head>
<body>

<header>
  <div class="wrap">
    <div class="hd">
      <div class="logo" aria-hidden="true">학</div>
      <div>
        <div class="ttl">학원파인더</div>
        <div class="sub" id="hdsub">전국 학원·교습소</div>
      </div>
      <div class="spacer"></div>
      <button class="iconbtn" id="homeBtn" title="지역 다시 고르기" aria-label="지역 다시 고르기" hidden>⌂</button>
      <button class="iconbtn" id="themeBtn" title="밝게/어둡게" aria-label="밝게/어둡게 전환">◐</button>
    </div>
    <div id="filters" hidden>
      <div class="bar">
        <div class="field"><select id="selSido" aria-label="시도 선택"></select></div>
        <div class="field"><select id="selSgg" aria-label="시군구 선택"></select></div>
      </div>
      <div class="bar">
        <div class="field"><select id="selDong" aria-label="읍면동 선택"></select></div>
        <div class="field"><select id="selSort" aria-label="정렬"></select></div>
      </div>
      <div class="bar qrow">
        <div class="searchbox">
          <input id="q" type="search" placeholder="학원명 검색 (초성도 됩니다)" aria-label="학원명 검색">
        </div>
        <button class="btn advbtn" id="advBtn" type="button"
                aria-expanded="false" aria-controls="adv">조건 ▾</button>
      </div>
      <!-- 나이·과목·종류는 접어 둔다. 펼치기 전에는 목록이 화면을 차지해야 한다
           (감사 2장: 첫 화면이 통째로 필터 벽) -->
      <div id="adv" hidden>
        <div class="frow"><span class="lbl">종류</span><div class="chips" id="rowKind"></div></div>
        <div class="frow"><span class="lbl">나이</span><div class="chips" id="rowAge"></div></div>
        <div class="frow"><span class="lbl">과목</span><div class="chips" id="rowCat"></div></div>
        <div class="subrow" id="rowSub" style="display:none"></div>
        <div class="hint-est" id="estHint" style="display:none"></div>
      </div>
    </div>
  </div>
</header>

<main class="wrap" id="main">
  <div class="loading" id="boot">데이터를 불러오는 중…</div>
</main>

<footer class="wrap">
  <div id="srcline"></div>
  <p style="margin:8px 0 0">
    이 서비스는 <b>학원 등록정보만</b> 보여줍니다. 평점·후기·순위·시설 사진은 원본에 없어
    제공하지 않으며, 임의로 만들지도 않았습니다. 학원 이름은 <b>교육청 등록명</b>이라
    간판 이름과 다를 수 있습니다. 수강료는 학원이 공개에 동의한 경우에만 표시됩니다.
    등록 정보는 교육청 신고 기준이라 현장과 다를 수 있으니 방문 전 확인하세요.
  </p>
  <p style="margin:8px 0 0" id="geoattr"></p>
  <p style="margin:8px 0 0">
    <a href="privacy.html">개인정보 처리방침</a>
  </p>
</footer>

<div class="backdrop" id="backdrop" role="dialog" aria-modal="true" aria-labelledby="shTitle">
  <div class="sheet" id="sheet"></div>
</div>

<script>
"use strict";
/* ────────────────────────────────────────────────────────────────────────
   학원파인더 전국판
   데이터: 나이스(NEIS) 교육정보 개방 포털 「학원교습소정보」
   · 전화번호는 사업장 유선·대표번호만 싣는다(휴대폰·더미 제외, build.py).
   · 나이·과목은 교육청 분류값을 build 때 미리 계산해 박아 둔 것이고,
     근거가 없으면 "미표기"로 남긴다. 화면이 임의로 통과시키지 않는다.
   · 학원 좌표는 원본에 없다. 지도는 주소 검색 링크뿐이고 거리순 정렬은 없다.
     위치정보는 "지금 어느 시군구인지" 고르는 데만 쓴다.
   ──────────────────────────────────────────────────────────────────────── */

var IDX = null;                 // data/index.json
var TAX = null;                 // data/taxonomy.json
var GEO = null;                 // data/regions_geo.json (시군구 대표 좌표)
var sido = null;                // 선택된 시도 메타
var sggSel = "";                // 선택된 시군구 slug ("" = 시도 전체)
var listAll = [];               // 현재 목록(전체 후보)
var shown = 0;
var PAGE = 60;
var mode = "sgg";               // "sgg" 시군구 상세 / "search" 시도 검색색인
var cacheSgg = {};
var cacheSearch = {};
var view = "pick";              // "pick" 시도고르기 / "sgg" 시군구고르기 / "list"
var navLock = false;            // popstate 처리 중 재푸시 방지
var geoNote = "";               // 위치로 지역을 골랐을 때 안내문
var filt = {kind:"", realm:"", feeOnly:false, telOnly:false,
            age:"", cat:"", sub:"", dong:"", sort:"name"};

var AGE_UNKNOWN = "none";       // "연령 미표기" 칩 id
var SUB_UNKNOWN = "none";       // "세부 미표기" 칩 id

var SORTS = [
  ["name", "이름순 (가나다)"],
  ["reg",  "최근 등록순"],
  ["tel",  "전화 있는 곳 먼저"],
  ["fee",  "수강료 공개 먼저"]
];

/* 전남광주통합특별시(2026-07-01 출범)를 옛 이름으로 찾는 사람이 많다 */
var SIDO_ALIAS = {
  "jeonnam-gwangju": ["광주", "광주광역시", "전남", "전라남도"],
  "gangwon": ["강원", "강원도"],
  "jeonbuk": ["전북", "전라북도"],
  "sejong": ["세종"]
};
var SIDO_SUBTITLE = {
  "jeonnam-gwangju": "구 광주광역시 · 전라남도"
};

var $ = function(s){ return document.querySelector(s); };
var el = function(t,c){ var e=document.createElement(t); if(c)e.className=c; return e; };

/* ── 초성 ────────────────────────────────────────────────────────────── */
var CHO = ["ㄱ","ㄲ","ㄴ","ㄷ","ㄸ","ㄹ","ㅁ","ㅂ","ㅃ","ㅅ","ㅆ","ㅇ","ㅈ","ㅉ","ㅊ","ㅋ","ㅌ","ㅍ","ㅎ"];
function choseong(s){
  var out = "";
  for (var i=0;i<s.length;i++){
    var c = s.charCodeAt(i);
    if (c>=0xAC00 && c<=0xD7A3) out += CHO[Math.floor((c-0xAC00)/588)];
    else out += s[i];
  }
  return out;
}
function isChoOnly(s){
  if (!s) return false;
  for (var i=0;i<s.length;i++){ if (CHO.indexOf(s[i])<0) return false; }
  return true;
}
function norm(s){ return (s||"").toLowerCase().replace(/[\s·・.\-()]/g,""); }

/* ── 유틸 ────────────────────────────────────────────────────────────── */
function esc(s){
  return String(s==null?"":s).replace(/[&<>"']/g,function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
  });
}
function won(n){ return Number(n).toLocaleString("ko-KR"); }
function ymd(s){
  if(!s || s.length!==8) return "";
  return s.slice(0,4)+"."+s.slice(4,6)+"."+s.slice(6,8);
}
function getJSON(url){
  return fetch(url,{cache:"default"}).then(function(r){
    if(!r.ok) throw new Error(url+" → HTTP "+r.status);
    return r.json();
  });
}
function toast(msg){
  var t = el("div","toast"); t.textContent = msg; document.body.appendChild(t);
  setTimeout(function(){ if(t.parentNode) t.parentNode.removeChild(t); }, 2600);
}
function telHref(v){ return "tel:" + String(v).replace(/[^0-9+]/g,""); }

/* ── 분류표 접근 ─────────────────────────────────────────────────────── */
function catDef(id){
  if (!TAX) return null;
  for (var i=0;i<TAX.cats.length;i++) if (TAX.cats[i].id===id) return TAX.cats[i];
  return null;
}
function ageBit(id){
  if (!TAX) return 0;
  for (var i=0;i<TAX.ages.length;i++) if (TAX.ages[i].id===id) return TAX.ages[i].bit;
  return 0;
}
/* 나이·과목 통과 판정 — 전부 build 때 박아 둔 코드값으로만 본다.
   구판은 "신호가 없으면 전 연령 통과"였고, 그래서 유아 필터에 대학편입 학원이 나왔다.
   지금은 근거 없는 건 어느 나이 필터에도 안 나오고 '연령 미표기'로만 나온다. */
function passAge(g){
  if (!filt.age) return true;
  g = g || 0;
  if (filt.age === AGE_UNKNOWN) return g === 0;
  return (g & ageBit(filt.age)) !== 0;
}
function passCat(s, x){
  if (!filt.cat) return true;
  var cats = (s||"") ? String(s).split(",") : [];
  if (cats.indexOf(filt.cat) < 0) return false;
  if (!filt.sub) return true;
  var list = (x||"") ? String(x).split(",") : [];
  if (filt.sub === SUB_UNKNOWN){
    var pre = filt.cat + ".";
    for (var i=0;i<list.length;i++) if (list[i].indexOf(pre)===0) return false;
    return true;                 // 고른 대분류 안에서 세부 신호가 하나도 없는 곳
  }
  return list.indexOf(filt.sub) >= 0;
}

/* ── URL 상태 (뒤로가기·공유·새로고침 복원) ──────────────────────────── */
function stateToHash(){
  var p = [];
  function add(k,v){ if(v) p.push(k+"="+encodeURIComponent(v)); }
  if (view === "pick") return "";
  add("s", sido ? sido.slug : "");
  if (view === "sgg") { add("v","sgg"); return p.length? "#"+p.join("&") : ""; }
  add("g", sggSel);
  add("d", filt.dong);
  add("age", filt.age); add("cat", filt.cat); add("sub", filt.sub);
  add("kind", filt.kind); add("realm", filt.realm);
  if (filt.feeOnly) p.push("fee=1");
  if (filt.telOnly) p.push("tel=1");
  if (filt.sort !== "name") add("sort", filt.sort);
  var q = $("#q") ? $("#q").value.trim() : "";
  add("q", q);
  if (openId){ add("id", openId); add("dg", openSgg); }
  return p.length ? "#"+p.join("&") : "";
}
function parseHash(){
  var h = location.hash.replace(/^#/,"");
  var o = {};
  if (!h) return o;
  h.split("&").forEach(function(kv){
    var i = kv.indexOf("=");
    if (i<0) return;
    o[kv.slice(0,i)] = decodeURIComponent(kv.slice(i+1).replace(/\+/g," "));
  });
  return o;
}
function pushState(replace){
  if (navLock) return;
  var h = stateToHash();
  var url = location.pathname + location.search + h;
  try{
    if (replace) history.replaceState({t:Date.now()}, "", url);
    else history.pushState({t:Date.now()}, "", url);
  }catch(e){}
}
function go(v, push){
  view = v;
  render();
  pushState(!push);
}
window.addEventListener("popstate", function(){
  navLock = true;
  applyHash(false);
  navLock = false;
});

function applyHash(initial){
  var o = parseHash();
  if (openId && !o.id) closeSheet(true);
  if (!o.s){
    sido = null; sggSel = ""; view = "pick";
    if (initial) { render(); maybeAutoLocate(); } else render();
    return;
  }
  var reg = IDX.regions.filter(function(r){return r.slug===o.s;})[0];
  if (!reg){ sido=null; view="pick"; render(); return; }
  sido = reg;
  $("#selSido").value = reg.slug;
  localStorage.setItem("hf.sido", reg.slug);
  if (o.v === "sgg" || !o.g && o.v === "sgg"){ sggSel=""; view="sgg"; buildSggSelect(); render(); return; }
  sggSel = o.g || "";
  filt.dong = o.d || "";
  filt.age  = o.age || "";
  filt.cat  = o.cat || "";
  filt.sub  = o.sub || "";
  filt.kind = o.kind || "";
  filt.realm= o.realm || "";
  filt.feeOnly = o.fee === "1";
  filt.telOnly = o.tel === "1";
  filt.sort = o.sort || "name";
  $("#q").value = o.q || "";
  view = "list";
  /* 링크로 들어왔는데 조건이 걸려 있으면 무엇이 걸렸는지 보이게 펼쳐 준다 */
  if (filt.age || filt.cat || filt.sub || filt.kind || filt.realm ||
      filt.feeOnly || filt.telOnly) $("#adv").hidden = false;
  buildSggSelect();
  var wantId = o.id || "";
  var wantSgg = o.dg || "";
  loadCurrent(function(){
    if (wantId) openById(wantId, wantSgg);
  });
}

function buildSidoSelect(){
  var s = $("#selSido");
  s.innerHTML = '<option value="">시도 선택</option>';
  IDX.regions.forEach(function(r){
    var o = el("option"); o.value=r.slug;
    o.textContent = r.name + " (" + won(r.count) + ")";
    s.appendChild(o);
  });
  s.addEventListener("change", function(){
    var slug = s.value;
    if (!slug){ sido=null; sggSel=""; go("pick", true); return; }
    sido = IDX.regions.filter(function(r){return r.slug===slug;})[0];
    localStorage.setItem("hf.sido", slug);
    sggSel = ""; filt.dong = ""; geoNote = "";
    buildSggSelect();
    go("sgg", true);
  });
  $("#selSgg").addEventListener("change", function(){
    sggSel = $("#selSgg").value; filt.dong = "";
    view = "list";
    loadCurrent(); pushState(false);
  });
  $("#selDong").addEventListener("change", function(){
    filt.dong = $("#selDong").value;
    applyAndRender(); pushState(true);
  });
  var t=null;
  $("#q").addEventListener("input", function(){
    clearTimeout(t);
    t = setTimeout(function(){
      if (view==="list" && mode==="search" && !cacheSearch[sido.slug]){ loadCurrent(); return; }
      applyAndRender(); pushState(true);
    }, 180);
  });
}
function buildSortSelect(){
  var s = $("#selSort");
  s.innerHTML = "";
  SORTS.forEach(function(kv){
    var o = el("option"); o.value=kv[0]; o.textContent=kv[1];
    s.appendChild(o);
  });
  s.value = filt.sort;
  s.addEventListener("change", function(){
    filt.sort = s.value; applyAndRender(); pushState(true);
  });
}

function buildToggles(){
  function chip(box, label, on, fn, cls){
    var b = el("button","chip"+(cls?" "+cls:""));
    b.type="button"; b.textContent=label;
    b.setAttribute("aria-pressed", on?"true":"false");
    b.addEventListener("click", function(){
      fn(b.getAttribute("aria-pressed")!=="true");
      buildToggles(); applyAndRender(); pushState(true);
    });
    box.appendChild(b);
  }
  /* 종류 행: 학원/교습소/전화/수강료 + 분야 select */
  var rk = $("#rowKind"); rk.innerHTML = "";
  chip(rk, "학원", filt.kind==="학원", function(v){ filt.kind = v?"학원":""; });
  chip(rk, "교습소", filt.kind==="교습소", function(v){ filt.kind = v?"교습소":""; });
  chip(rk, "☎ 전화 있음", filt.telOnly, function(v){ filt.telOnly = v; });
  chip(rk, "수강료 공개", filt.feeOnly, function(v){ filt.feeOnly = v; });
  var sel = el("select");
  sel.setAttribute("aria-label","분야 선택");
  sel.style.maxWidth = "190px";
  sel.innerHTML = '<option value="">분야 전체</option>';
  IDX.realms.forEach(function(r){
    var o=el("option"); o.value=r.name;
    o.textContent = r.name + " (" + won(r.count) + ")";
    if (r.name===filt.realm) o.selected = true;
    sel.appendChild(o);
  });
  sel.addEventListener("change", function(){
    filt.realm = sel.value; applyAndRender(); pushState(true);
  });
  rk.appendChild(sel);

  /* 나이 행 — '연령 미표기'를 별도 칩으로 준다 */
  var ra = $("#rowAge"); ra.innerHTML = "";
  chip(ra, "전체", filt.age==="", function(){ filt.age=""; });
  (TAX.ages||[]).forEach(function(a){
    chip(ra, a.name, filt.age===a.id, function(v){ filt.age = v ? a.id : ""; });
  });
  chip(ra, TAX.age_unknown_label || "연령 미표기", filt.age===AGE_UNKNOWN,
       function(v){ filt.age = v ? AGE_UNKNOWN : ""; }, "warnish");

  /* 과목 행 + 세부 행 */
  var rc = $("#rowCat"); rc.innerHTML = "";
  chip(rc, "전체", filt.cat==="", function(){ filt.cat=""; filt.sub=""; });
  (TAX.cats||[]).forEach(function(cdef){
    var label = cdef.name + (cdef.subs && cdef.subs.length ? " ▸" : "");
    chip(rc, label, filt.cat===cdef.id, function(v){
      filt.cat = v ? cdef.id : ""; filt.sub = "";
    });
  });
  var rs = $("#rowSub"); rs.innerHTML = "";
  var cur = catDef(filt.cat);
  if (cur && cur.subs && cur.subs.length){
    rs.style.display = "flex";
    chip(rs, "전체", filt.sub==="", function(){ filt.sub=""; }, "sub");
    cur.subs.forEach(function(sd){
      chip(rs, sd.name, filt.sub===sd.id, function(v){ filt.sub = v ? sd.id : ""; }, "sub");
    });
    chip(rs, TAX.sub_unknown_label || "세부 미표기", filt.sub===SUB_UNKNOWN,
         function(v){ filt.sub = v ? SUB_UNKNOWN : ""; }, "sub warnish");
  } else {
    rs.style.display = "none";
  }

  /* 접어 둔 채로도 몇 개가 걸려 있는지 보이게 */
  var nOn = 0;
  if (filt.kind) nOn++;
  if (filt.realm) nOn++;
  if (filt.feeOnly) nOn++;
  if (filt.telOnly) nOn++;
  if (filt.age) nOn++;
  if (filt.cat) nOn++;
  if (filt.sub) nOn++;
  var ab = $("#advBtn");
  if (ab){
    var open = $("#adv") && !$("#adv").hidden;
    ab.innerHTML = "조건 " + (open ? "▴" : "▾") +
                   (nOn ? '<span class="n">' + nOn + "</span>" : "");
    ab.setAttribute("aria-expanded", open ? "true" : "false");
  }

  var hint = [];
  if (filt.age) hint.push(TAX.basis && TAX.basis.age ? TAX.basis.age : "");
  if (filt.cat) hint.push(TAX.basis && TAX.basis.cat ? TAX.basis.cat : "");
  if (filt.sub) hint.push(TAX.basis && TAX.basis.sub ? TAX.basis.sub : "");
  if (filt.cat==="lang" && filt.sub==="en" && TAX.basis && TAX.basis.brand_en)
    hint.push(TAX.basis.brand_en);
  var hh = $("#estHint");
  hh.textContent = hint.filter(Boolean).join(" ");
  hh.style.display = hint.length ? "block" : "none";
}

/* ── 첫 화면: 지역 고르기 ────────────────────────────────────────────── */
function sidoMatches(r, q){
  if (!q) return true;
  var n = norm(q);
  if (norm(r.name).indexOf(n) >= 0) return true;
  var al = SIDO_ALIAS[r.slug] || [];
  for (var i=0;i<al.length;i++) if (norm(al[i]).indexOf(n)>=0 || n.indexOf(norm(al[i]))>=0) return true;
  return false;
}
var pickQuery = "";

  var w = el("div","pickwrap");
  var h = el("h2"); h.textContent = "어디에서 찾으세요?";

                  won(IDX.total) + "곳 · " + ymd(IDX.basis_date) + " 기준.";
  w.appendChild(p);

  if (GEO && GEO.rows && GEO.rows.length && navigator.geolocation){

                   '<small>지금 있는 시군구를 자동으로 골라 줍니다</small></span>';

    w.appendChild(nb);

  if (geoErr){

  }

  var last = localStorage.getItem("hf.sido");

    rb.addEventListener("click", function(){
      sido = lastReg; $("#selSido").value = lastReg.slug;
      sggSel=""; buildSggSelect(); go("sgg", true);
    });
    w.appendChild(rb);

  var ps = el("input","picksearch"); ps.type="search";
  ps.placeholder = "지역 이름으로 찾기 (예: 광주, 서울)";
  ps.setAttribute("aria-label","지역 이름으로 찾기");
  ps.value = pickQuery;
  ps.addEventListener("input", function(){
    pickQuery = ps.value.trim();
    fillSidoGrid(g, pickQuery);
  });
  w.appendChild(ps);

  var g = el("div","sidogrid");
  w.appendChild(g);
  m.appendChild(w);
  fillSidoGrid(g, pickQuery);
  if (pickQuery) ps.focus();

function fillSidoGrid(g, q){
  g.innerHTML = "";
  var hit = 0;
  IDX.regions.forEach(function(r){
    if (!sidoMatches(r, q)) return;
    hit++;
    var b = el("button","sidobtn"); b.type="button";
    var sub = SIDO_SUBTITLE[r.slug];
    b.innerHTML = '<div class="nm">'+esc(r.name)+'</div>'+
                  '<div class="ct">'+won(r.count)+'곳 · 시군구 '+
                  r.sigungu.filter(function(s){return s.name!=="(주소 불명)";}).length+'</div>'+
                  (sub ? '<div class="alias">'+esc(sub)+'</div>' : '');
    b.addEventListener("click", function(){
      sido = r; $("#selSido").value = r.slug;
      localStorage.setItem("hf.sido", r.slug);
      sggSel=""; filt.dong=""; buildSggSelect(); go("sgg", true);
    });
    g.appendChild(b);
  });
  if (!hit){
    var e = el("div","empty");
    e.innerHTML = "<p>그 이름의 지역이 없습니다.</p>"+
      "<p><small>2026년 7월부터 광주광역시와 전라남도는 "+
      "<b>전남광주통합특별시</b> 하나로 합쳐졌습니다.</small></p>";
    g.appendChild(e);
  }
}

/* ── 두 번째 화면: 시군구 고르기 ─────────────────────────────────────── */
function renderSggPicker(){
  var m = $("#main");
  m.innerHTML = "";
  var w = el("div","pickwrap");
  var back = el("button","backlink"); back.type="button";
  back.textContent = "← 다른 시도 고르기";
  back.addEventListener("click", function(){ sido=null; $("#selSido").value=""; go("pick", true); });
  w.appendChild(back);
  var h = el("h2"); h.textContent = sido.name + " — 어느 시군구인가요?";
  w.appendChild(h);
  var p = el("p","lede");
  p.textContent = "시군구를 고르면 주소·전화·교습과정까지 보이고 읍면동으로 더 좁힐 수 있습니다.";
  w.appendChild(p);
  if (geoNote){
    var gn = el("div","locbar"); gn.textContent = geoNote;
    w.appendChild(gn);
  }

  var g = el("div","sidogrid");
  var near = nearestOrder();
  var list = sido.sigungu.filter(function(s){ return s.name !== "(주소 불명)"; });
  if (near) list = list.slice().sort(function(a,b){
    var da = near[a.slug], db = near[b.slug];
    if (da==null && db==null) return a.name.localeCompare(b.name,"ko");
    if (da==null) return 1;
    if (db==null) return -1;
    return da-db;
  });
  list.forEach(function(s){
    var b = el("button","sidobtn"); b.type="button";
    var dkm = near && near[s.slug]!=null ? (" · 약 "+Math.round(near[s.slug])+"km") : "";
    b.innerHTML = '<div class="nm">'+esc(s.name)+'</div>'+
                  '<div class="ct">'+won(s.count)+'곳'+esc(dkm)+'</div>';
    b.addEventListener("click", function(){
      sggSel = s.slug; filt.dong=""; $("#selSgg").value = s.slug;
      view = "list"; loadCurrent(); pushState(false);
    });
    g.appendChild(b);

/* ── 위치 ────────────────────────────────────────────────────────────── */
var geoErr = "";
var myPos = null;
function haversine(a1,o1,a2,o2){
  var R=6371, t=Math.PI/180;
  var dA=(a2-a1)*t, dO=(o2-o1)*t;
  var s=Math.sin(dA/2)*Math.sin(dA/2)+
        Math.cos(a1*t)*Math.cos(a2*t)*Math.sin(dO/2)*Math.sin(dO/2);
  return 2*R*Math.asin(Math.min(1,Math.sqrt(s)));
}
function nearestOrder(){
  if (!myPos || !GEO || !sido) return null;
  var out = {}, any=false;
  GEO.rows.forEach(function(r){
    if (r[0] !== sido.slug) return;
    out[r[1]] = haversine(myPos.lat, myPos.lng, r[2], r[3]);
    any = true;
  });
  return any ? out : null;
}
function nearestSgg(lat,lng){
  var best=null, bd=1e9;
  GEO.rows.forEach(function(r){
    var d = haversine(lat,lng,r[2],r[3]);
    if (d<bd){ bd=d; best=r; }
  });
  return best ? {sido:best[0], sgg:best[1], km:bd} : null;
}
function locateMe(btn){
  if (!navigator.geolocation || !GEO) return;
  geoErr = "";
  if (btn){ btn.disabled = true; btn.querySelector("small").textContent = "위치를 확인하는 중…"; }
  navigator.geolocation.getCurrentPosition(function(pos){
    myPos = {lat:pos.coords.latitude, lng:pos.coords.longitude};
    var hit = nearestSgg(myPos.lat, myPos.lng);
    if (!hit){ geoErr = "위치는 받았지만 가까운 지역을 찾지 못했습니다."; render(); return; }
    var reg = IDX.regions.filter(function(r){return r.slug===hit.sido;})[0];
    if (!reg){ geoErr = "위치에 해당하는 지역 데이터가 없습니다."; render(); return; }
    var sg = reg.sigungu.filter(function(s){return s.slug===hit.sgg;})[0];
    sido = reg; sggSel = hit.sgg; filt.dong = "";
    $("#selSido").value = reg.slug; buildSggSelect(); $("#selSgg").value = hit.sgg;
    localStorage.setItem("hf.sido", reg.slug);
    geoNote = "현재 위치에서 가장 가까운 " + reg.name +
              (sg ? " " + sg.name : "") +
              "로 맞췄습니다. 다르면 위에서 지역을 바꾸세요.";
    view = "list"; loadCurrent(); pushState(false);
  }, function(err){
    geoErr = err.code === 1
      ? "위치 권한이 거부되어 아래에서 지역을 골라야 합니다."
      : "위치를 받지 못했습니다(" + esc(err.message) + "). 아래에서 지역을 고르세요.";
    if (btn){ btn.disabled = false; btn.querySelector("small").textContent =
              "지금 있는 시군구를 자동으로 골라 줍니다"; }
    render();
  }, {enableHighAccuracy:false, timeout:8000, maximumAge:600000});
}
/* 이미 위치 권한을 준 사용자는 첫 화면부터 '내 주변'으로 연다 */
function maybeAutoLocate(){
  if (!GEO || !navigator.geolocation || !navigator.permissions ||
      !navigator.permissions.query || location.hash) return;
  try{
    navigator.permissions.query({name:"geolocation"}).then(function(p){
      if (p.state === "granted" && view === "pick") locateMe(null);
    }).catch(function(){});
  }catch(e){}
}

function matchName(nameNorm, nameCho, q){
  if (isChoOnly(q)) return nameCho.indexOf(q) >= 0;
  return nameNorm.indexOf(norm(q)) >= 0;
}

function applyAndRender(){
  if (!sido || view !== "list") return;
  var q = $("#q").value.trim();
  var rows = [];

  if (mode === "sgg"){
    for (var i=0;i<listAll.length;i++){
      var r = listAll[i];
      if (filt.kind && r.k!==filt.kind) continue;
      if (filt.realm && r.f!==filt.realm) continue;
      if (filt.feeOnly && !r.p) continue;
      if (filt.telOnly && !r.v) continue;
      if (filt.dong){
        if (filt.dong === "__none__"){ if (r.d) continue; }
        else if (r.d !== filt.dong) continue;
      }
      if (!passAge(r.g)) continue;
      if (!passCat(r.s||"", r.w||"")) continue;
      if (q && !matchName(norm(r.n), choseong(r.n), q)) continue;
      rows.push({light:false, rec:r, sgg:r.u, n:r.n,
                 reg:r.r||"", tel:!!r.v, fee:!!r.p});
    }
  } else {
    var ix = cacheSearch[sido.slug];
    if (!ix) return;
    var names = sido.sigungu;
    for (var j=0;j<ix.n.length;j++){
      if (filt.kind && ix.k[j]!==filt.kind) continue;
      if (filt.realm && ix.f[j]!==filt.realm) continue;
      if (filt.feeOnly && !ix.p[j]) continue;
      if (filt.telOnly && !(ix.tp && ix.tp[j])) continue;
      if (!passAge(ix.ag ? ix.ag[j] : 0)) continue;
      if (!passCat(ix.sc?ix.sc[j]:"", ix.sx?ix.sx[j]:"")) continue;
      if (q && !matchName(ix.nn[j], ix.cho[j], q)) continue;
      rows.push({light:true, n:ix.n[j], gi:ix.g[j], di:ix.d[j],
                 k:ix.k[j], f:ix.f[j], p:ix.p[j],
                 tel:!!(ix.tp && ix.tp[j]), fee:!!ix.p[j],
                 reg:(ix.rd?ix.rd[j]:""),
                 sgg:names[ix.g[j]].name});
    }
  }
  sortRows(rows);
  renderList(rows);
}
function sortRows(rows){
  var s = filt.sort;
  if (s === "reg"){
    rows.sort(function(a,b){
      var x=(b.reg||""), y=(a.reg||"");
      return x===y ? a.n.localeCompare(b.n,"ko") : (x>y?1:-1);
    });
  } else if (s === "tel"){
    rows.sort(function(a,b){
      if (a.tel!==b.tel) return a.tel?-1:1;
      return a.n.localeCompare(b.n,"ko");
    });
  } else if (s === "fee"){
    rows.sort(function(a,b){
      if (a.fee!==b.fee) return a.fee?-1:1;
      return a.n.localeCompare(b.n,"ko");
    });
  }
  /* 기본(name)은 build 가 시군구·가나다순으로 이미 정렬해 둔 순서를 그대로 쓴다 */
}

   (파일 안 순번은 갱신 때마다 바뀔 수 있어 순번으로 링크를 걸지 않는다) */
function openById(id, dgSlug){

    return null;

  }

  if (cacheSgg[key]){
    var h2 = findIn(cacheSgg[key]);

    return;
  }
  getJSON("data/regions/"+sido.slug+"/"+dgSlug+".json").then(function(rs){

/* 같은 과목이 금액만 다르게 두 번 나오는 원본을 묶어서 범위로 보여준다 (감사 C2) */
function parseFees(s){
  var byName = {}, order = [];
  s.split(",").forEach(function(part){
    var p = part.trim(); if (!p) return;
    var k = p.lastIndexOf(":");
    var nm, va;
    if (k < 0){ nm = p; va = ""; }
    else { nm = p.slice(0,k).trim(); va = p.slice(k+1).trim(); }
    if (!byName[nm]){ byName[nm] = []; order.push(nm); }
    byName[nm].push(va);
  });
  return order.map(function(nm){
    var vals = byName[nm];
    var nums = vals.filter(function(v){ return /^\d+$/.test(v); }).map(Number);
    var text = vals.filter(function(v){ return !/^\d+$/.test(v) && v; });
    var amt;
    if (nums.length){
      var lo = Math.min.apply(null, nums), hi = Math.max.apply(null, nums);
      amt = (lo===hi) ? won(lo)+"원" : won(lo)+"~"+won(hi)+"원";
      if (nums.length>1 && lo!==hi) amt += " (" + nums.length + "건)";
    } else {
      amt = text.join(" / ");
    }
    return {name:nm, amt:amt};
  });
}

function showSheet(r, noPush){
  if (!r){ return; }
  openId = r.i || "";
  var s = $("#sheet");
  var q = encodeURIComponent(r.a || r.n);
  var rows = [];
  rows.push(["구분", r.k]);
  rows.push(["분야", r.f || "—"]);
  if (r.o) rows.push(["교습계열", r.o]);
  if (r.c) rows.push(["교습과정", r.c]);
  if (r.l && r.l !== r.c) rows.push(["교습과정 목록", r.l]);
  rows.push(["주소", (r.a||"—") + (r.z ? " ("+r.z+")" : "")]);
  if (r.v) rows.push(["전화", r.v]);
  if (r.t) rows.push(["정원", won(r.t)+"명"]);
  if (r.m) rows.push(["일시수용", won(r.m)+"명"]);
  if (r.e) rows.push(["개설일", ymd(r.e)]);
  if (r.r) rows.push(["등록일", ymd(r.r)]);
  if (r.b) rows.push(["기숙사", "운영"]);
  if (r.h) rows.push(["상태", "휴원 중 (교육청 신고 기준)"]);

  var html = '<div class="sheethd"><h2 id="shTitle">'+esc(r.n)+'</h2>'+
             '<div class="spacer"></div>'+
             '<button class="iconbtn" id="closeBtn" aria-label="닫기">✕</button></div>';
  html += '<div style="font-size:12px;color:var(--fg-mute);margin-top:2px">'+
          '교육청 등록명 — 간판 이름과 다를 수 있습니다</div>';
  html += '<div class="tags" style="margin-top:8px">'+
          '<span class="tag k">'+esc(r.k)+'</span>'+
          (r.v ? '<span class="tag tel">☎ 전화 있음</span>' : '')+
          (r.p ? '<span class="tag fee">수강료 공개</span>' : '')+
          (r.h ? '<span class="tag rest">휴원 중</span>' : '')+
          (r.b ? '<span class="tag dorm">기숙사</span>' : '')+'</div>';

  /* 1순위 행동 = 전화 걸기 */
  html += '<div class="acts">';
  if (r.v)
    html += '<a class="btn call" href="'+esc(telHref(r.v))+'">'+
            '<span aria-hidden="true">☎</span> 전화 걸기 '+esc(r.v)+'</a>';
  html += '<button class="btn" id="shareBtn" type="button">🔗 공유</button>';
  html += '</div>';
  if (!r.v)
    html += '<div style="font-size:12px;color:var(--fg-mute);margin-top:7px">'+
            '이 학원은 원본에 사업장 전화번호가 없습니다(휴대폰만 등록됐거나 미기재).</div>';

  html += '<dl class="dl">';
  rows.forEach(function(kv){
    html += "<dt>"+esc(kv[0])+"</dt><dd>"+esc(kv[1])+"</dd>";
  });
  html += "</dl>";

  if (r.p){
    var fees = parseFees(r.p);
    html += '<div style="margin-top:16px"><div style="font-size:13.5px;color:var(--fg-mute)">'+
            '인당 수강료 <span style="color:var(--fg-dim)">— 학원이 공개에 동의한 값</span></div>'+
            '<ul class="feelist">';
    fees.forEach(function(f){
      html += "<li><span>"+esc(f.name)+'</span><span class="amt">'+esc(f.amt)+"</span></li>";
    });
    html += "</ul>"+
            '<div style="font-size:11.5px;color:var(--fg-mute);margin-top:6px">'+
            '원본에 <b>수업 시간·횟수·기간</b>이 없어 월 기준인지 회당인지 알 수 없습니다. '+
            '같은 과목이 여러 금액으로 등록돼 있으면 범위로 묶어 보여 줍니다.</div></div>';
  }

  if (r.a){
    html += '<div class="seclbl">주소로 지도 열기 — 학원 좌표가 원본에 없어 '+
            '<b>주소를 검색</b>해 여는 링크입니다(건물까지만 맞습니다)</div>'+
            '<div class="maplinks">'+
      '<a target="_blank" rel="noopener" href="https://map.kakao.com/?q='+q+'">카카오맵</a>'+
      '<a target="_blank" rel="noopener" href="https://map.naver.com/p/search/'+q+'">네이버지도</a>'+
      '<a target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query='+q+'">구글지도</a>'+
      '</div>';
  }

  html += '<div class="notice">'+
    '<b>이 화면의 정보는 어디서 왔나</b><br>'+
    '교육청에 신고된 등록정보입니다. 전화번호는 원본의 사업장 유선·대표번호만 싣고 '+
    '개인 휴대폰(01x)은 싣지 않습니다.<br>'+
    '<b>원본에 없어 표시하지 않는 것</b><br>'+
    '위치 좌표, 평점·후기·순위, 강사 정보, 시설 사진, 실제 운영시간·시간표.<br>'+
    (r.p ? '' : '이 학원은 수강료를 공개하지 않아 금액이 없습니다.<br>')+
    '등록 정보는 시도교육청 신고 기준이며 현장과 다를 수 있습니다.'+
    '</div>';

  s.innerHTML = html;
  $("#backdrop").classList.add("on");
  document.body.style.overflow = "hidden";
  $("#closeBtn").addEventListener("click", function(){ closeSheet(); });
  var sb = $("#shareBtn");
  if (sb) sb.addEventListener("click", function(){ shareCurrent(r); });
  s.scrollTop = 0;
  if (!noPush) pushState(false);
}
function shareCurrent(r){
  var url = location.href;
  var data = {title:"학원파인더 — "+r.n,
              text:r.n+(r.a?" ("+r.a+")":"")+(r.v?" ☎"+r.v:""), url:url};
  if (navigator.share){
    navigator.share(data).catch(function(){});
  } else if (navigator.clipboard){
    navigator.clipboard.writeText(url).then(function(){ toast("링크를 복사했습니다"); },
                                            function(){ toast(url); });
  } else {
    toast(url);
  }
}
function closeSheet(silent){
  var was = openId;
  openId = "";
  $("#backdrop").classList.remove("on");
  document.body.style.overflow = "";
  if (was && !silent && !navLock) history.back();
}
$("#backdrop").addEventListener("click", function(e){
  if (e.target === $("#backdrop")) closeSheet();
});
document.addEventListener("keydown", function(e){
  if (e.key === "Escape" && openId) closeSheet();
});

/* 무한 스크롤 */
window.addEventListener("scroll", function(){
  if (!curRows.length || shown >= curRows.length) return;
  if (window.innerHeight + window.scrollY >= document.body.offsetHeight - 700) page();
});

/* PWA */
if ("serviceWorker" in navigator){
  window.addEventListener("load", function(){
    navigator.serviceWorker.register("sw.js").catch(function(){});
  });
}
</script>
</body>
</html>
