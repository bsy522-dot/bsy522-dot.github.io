<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>헬스장파인더 — 내 주변 헬스장·수영장 찾기</title>
<meta name="description" content="행정안전부 인허가 데이터로 만든 전국 체력단련장·수영장·종합체육시설 디렉토리. 내 위치에서 가까운 순으로 보고, 전화번호가 있으면 바로 걸 수 있습니다.">
<meta name="theme-color" content="#0f172a">
<meta name="color-scheme" content="dark light">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta property="og:type" content="website">
<meta property="og:title" content="헬스장파인더 — 내 주변 헬스장·수영장 찾기">
<meta property="og:description" content="행정안전부 인허가 데이터 기반 전국 체력단련장·수영장 디렉토리">
<link rel="stylesheet" href="vendor/leaflet.css">
<style>
  :root{
    --bg:#0b1220; --surface:#111a2b; --surface-2:#17233a; --line:#243352;
    --fg:#e8eefc; --fg-dim:#9fb0d0; --fg-mute:#6d7f9f;
    --accent:#34d399; --accent-fg:#052e1b; --accent-soft:rgba(52,211,153,.14);
    --open:#34d399; --rest:#fbbf24; --closed:#f87171; --void:#94a3b8;
    --radius:14px; --shadow:0 8px 28px rgba(0,0,0,.38);
    --tap:44px;                 /* 최소 터치 타겟 */
  }
  html[data-theme="light"]{
    --bg:#f4f7fb; --surface:#ffffff; --surface-2:#eef3fa; --line:#d8e2f0;
    --fg:#101a2c; --fg-dim:#4a5b76; --fg-mute:#6b7a94;
    --accent:#0f9d63; --accent-fg:#ffffff; --accent-soft:rgba(15,157,99,.12);
    --open:#0f9d63; --rest:#a06a10; --closed:#d64545; --void:#7a8aa1;
    --shadow:0 8px 24px rgba(16,26,44,.10);
  }
  *{box-sizing:border-box}
  html{height:100%}
  body{
    margin:0; background:var(--bg); color:var(--fg);
    font-family:-apple-system,BlinkMacSystemFont,"Malgun Gothic","맑은 고딕",
      "Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;
    font-size:15px; line-height:1.5; -webkit-text-size-adjust:100%;
    /* 글자확대 시에도 레이아웃이 무너지지 않도록 높이 계산을 JS 가 아닌
       flex 에 맡긴다. (예전엔 main 높이를 calc(100vh - 헤더높이) 로 박아넣어서
       헤더가 커지면 목록이 사라졌다.) */
    height:100vh; height:100dvh;
    display:flex; flex-direction:column; overflow:hidden;
  }
  button,select,input{font:inherit; color:inherit}
  button{cursor:pointer}
  :focus-visible{outline:2px solid var(--accent); outline-offset:2px}

  /* ---------- header ---------- */
  header{
    flex:none; background:var(--surface); border-bottom:1px solid var(--line);
    padding:8px 12px 9px;
    /* 하드 상한 — 글자를 아무리 키워도 헤더가 화면의 38% 를 넘지 못한다.
       (건수·목록/지도 줄은 header 밖으로 빼서 항상 보이게 했다.) */
    max-height:38vh; overflow-y:auto; overscroll-behavior:contain;
  }
  .bar{display:flex; align-items:center; gap:8px; min-width:0}
  .brand{display:flex; flex-direction:column; align-items:flex-start; min-width:0; flex:1}
  .brand h1{margin:0; font-size:1.15rem; font-weight:800; letter-spacing:-.02em;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%}
  .brand .dot{color:var(--accent)}
  /* 확대하면 잘리는 대신 단위째 다음 줄로 내려간다(재감사 4-1 #3). */
  .brand small{color:var(--fg-mute); font-size:.75rem; line-height:1.35; max-width:100%}
  .brand small span{display:inline-block}
  .icon-btn{
    flex:none; background:var(--surface-2); border:1px solid var(--line); color:var(--fg-dim);
    border-radius:11px; min-width:var(--tap); min-height:var(--tap);
    display:grid; place-items:center; font-size:1rem;
  }
  .icon-btn:hover{color:var(--fg); border-color:var(--accent)}

  /* 내 주변 / 지역 — 이 앱의 주 행동. 라벨을 반드시 붙인다. */
  .quick{display:flex; gap:8px; margin-top:8px; flex-wrap:wrap}
  .qbtn{
    display:inline-flex; align-items:center; justify-content:center; gap:6px;
    min-height:var(--tap); padding:6px 14px; border-radius:12px;
    border:1px solid var(--line); background:var(--surface-2); color:var(--fg);
    font-size:.9rem; font-weight:600; min-width:0;
  }
  .qbtn svg{flex:none; width:1.05em; height:1.05em}
  .qbtn .lbl{overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0}
  /* em 기준 폭 — 글자를 키우면 눌려 잘리는 대신 다음 줄로 내려간다 */
  .qbtn.near{flex:0 1 auto; background:var(--accent); border-color:var(--accent);
    color:var(--accent-fg); font-weight:700}
  /* 토글이 아니라 '실행' 버튼이라 aria-pressed 를 쓰지 않는다(재감사 4-1 #5).
     지금 거리순으로 보고 있다는 사실만 시각적으로 표시한다. */
  .qbtn.near[data-active="true"]{box-shadow:inset 0 0 0 2px rgba(255,255,255,.28)}
  .qbtn.region{flex:1 1 12em; justify-content:space-between; text-align:left}
  .qbtn .caret{flex:none; opacity:.7; font-size:.75em}

  /* ---------- 검색 ---------- */
  .field{position:relative; margin-top:8px; min-width:0}
  input[type="search"]{
    width:100%; background:var(--surface-2); border:1px solid var(--line);
    color:var(--fg); border-radius:11px; padding:0 12px; min-height:var(--tap);
    outline:none; min-width:0; -webkit-appearance:none; appearance:none;
    text-overflow:ellipsis;
  }
  input::placeholder{text-overflow:ellipsis}
  input:focus{border-color:var(--accent)}
  input[type="search"]::-webkit-search-cancel-button{filter:invert(.5)}

  /* ---------- 필터 칩 ---------- */
  .chipsWrap{position:relative; margin-top:8px}
  /* 양옆이 잘려 있다는 사실을 페이드로 알린다(스크롤 힌트) */
  .chipsWrap::after,.chipsWrap::before{
    content:""; position:absolute; top:0; bottom:0; width:30px;
    pointer-events:none; opacity:0; transition:opacity .15s; z-index:1;
  }
  .chipsWrap::after{right:0; background:linear-gradient(to right,transparent,var(--surface))}
  .chipsWrap::before{left:0; background:linear-gradient(to left,transparent,var(--surface))}
  .chipsWrap[data-more="1"]::after{opacity:1}
  .chipsWrap[data-back="1"]::before{opacity:1}
  .chips{
    display:flex; gap:6px; flex-wrap:nowrap; overflow-x:auto;
    scrollbar-width:none; -ms-overflow-style:none; padding:1px 0;
  }
  .chips::-webkit-scrollbar{display:none}
  .chip{
    flex:none; display:inline-flex; align-items:center; gap:5px;
    background:var(--surface-2); border:1px solid var(--line); color:var(--fg-dim);
    border-radius:999px; padding:0 13px; min-height:var(--tap);
    font-size:.83rem; white-space:nowrap;
  }
  .chip[aria-pressed="true"]{background:var(--accent-soft); border-color:var(--accent); color:var(--accent)}
  .chip .cnt{opacity:.65; font-size:.72rem}
  .chipdiv{flex:none; width:1px; background:var(--line); margin:8px 3px; align-self:stretch}

  /* 건수와 목록/지도 전환은 헤더 상한에 걸려 잘리면 안 되므로 header 밖에 둔다. */
  .summary{
    flex:none; display:flex; align-items:center; gap:8px;
    background:var(--surface); border-bottom:1px solid var(--line);
    padding:6px 12px 7px; font-size:.8rem; color:var(--fg-dim);
    flex-wrap:wrap; min-width:0;
  }
  .summary b{color:var(--fg); font-variant-numeric:tabular-nums}
  #countLine{min-width:0; overflow:hidden; text-overflow:ellipsis}
  .viewtabs{display:none; gap:6px; margin-left:auto; flex:none}

  /* 목록을 내리면 브랜드줄만 접는다. 업종·전화·즐겨찾기 필터 칩은 계속 보여야
     목록을 내려간 뒤에도 맨 위로 돌아가지 않고 필터를 바꿀 수 있다(재감사 4-1 #6). */
  header.compact .bar{display:none}

  /* ---------- layout ---------- */
  main{flex:1; min-height:0; display:grid; grid-template-columns:1fr}
  @media (min-width:900px){
    main{grid-template-columns:minmax(360px,42%) 1fr}
    .qbtn.region{flex:0 1 20em}
  }
  .pane{min-height:0; min-width:0; overflow:hidden; display:flex; flex-direction:column}
  #listPane{border-right:1px solid var(--line)}
  #mapPane{position:relative}
  #map{position:absolute; inset:0; background:var(--surface-2)}
  .maphint{
    position:absolute; left:52px; right:8px; top:8px; z-index:500;
    background:var(--surface); border:1px solid var(--line); border-radius:10px;
    padding:7px 11px; font-size:.75rem; color:var(--fg-dim); box-shadow:var(--shadow);
  }
  @media (max-width:899px){
    main{grid-template-columns:1fr}
    .viewtabs{display:flex}
    #mapPane{display:none}
    body[data-view="map"] #listPane{display:none}
    body[data-view="map"] #mapPane{display:flex}
  }

  /* ---------- 목록 ---------- */
  .listwrap{overflow-y:auto; -webkit-overflow-scrolling:touch; padding:10px 12px 0; flex:1}
  .card{
    display:flex; align-items:stretch; gap:8px;
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
    margin-bottom:8px; overflow:hidden;
  }
  .card:hover{border-color:var(--accent)}
  .card.active{border-color:var(--accent); background:var(--accent-soft)}
  .cardmain{
    flex:1; min-width:0; background:none; border:0; text-align:left;
    padding:11px 4px 11px 13px; color:inherit;
  }
  .card .top{display:flex; align-items:center; gap:7px; margin-bottom:3px; min-width:0}
  .card .name{font-weight:700; font-size:.95rem; letter-spacing:-.01em; min-width:0;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .badge{font-size:.7rem; padding:1px 7px; border-radius:999px; white-space:nowrap; flex:none;
    border:1px solid currentColor; font-weight:600}
  .b-open{color:var(--open)} .b-rest{color:var(--rest)}
  .b-closed{color:var(--closed)} .b-void{color:var(--void)}
  .card .addr{font-size:.8rem; color:var(--fg-dim); overflow:hidden;
    text-overflow:ellipsis; white-space:nowrap}
  .card .meta{font-size:.74rem; color:var(--fg-mute); margin-top:3px;
    display:flex; gap:7px; flex-wrap:wrap}
  .card .meta .d{color:var(--accent); font-weight:700}
  /* 앱 안에서 끝나는 행동 — 카드에서 바로 저장/전화 */
  .cardact{
    flex:none; width:3.4em; min-width:48px; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:2px; text-decoration:none;
    border:0; border-left:1px solid var(--line); font-size:.68rem; font-weight:700;
    background:none; color:var(--fg-mute);
  }
  .cardact span{white-space:nowrap}
  .cardact svg{width:1.3em; height:1.3em}
  .favbtn[aria-pressed="true"]{color:#f0b429}
  .favbtn:hover{color:var(--fg)}
  .callbtn{background:var(--accent-soft); color:var(--accent)}
  .callbtn:hover{background:var(--accent); color:var(--accent-fg)}

  .empty{text-align:center; color:var(--fg-mute); padding:40px 16px; font-size:.9rem}
  .empty b{display:block; color:var(--fg-dim); margin-bottom:6px; font-size:1rem}
  .more{width:100%; min-height:var(--tap); padding:11px; border-radius:11px;
    background:var(--surface-2); border:1px solid var(--line); color:var(--fg-dim); margin-top:4px}

  /* ---------- 첫 화면 안내 ---------- */
  .intro{padding:26px 18px 10px; text-align:center}
  .intro .ill{width:64px; height:64px; margin:0 auto 14px; color:var(--accent)}
  .intro h2{margin:0 0 8px; font-size:1.15rem; letter-spacing:-.02em}
  .intro p{margin:0 auto 18px; max-width:32em; color:var(--fg-dim); font-size:.86rem; line-height:1.6}
  .intro .btns{display:flex; flex-direction:column; gap:9px; max-width:22em; margin:0 auto}
  .btn-primary,.btn-ghost{
    min-height:48px; border-radius:12px; font-size:.95rem; font-weight:700;
    display:inline-flex; align-items:center; justify-content:center; gap:7px;
    border:1px solid var(--accent);
  }
  .btn-primary{background:var(--accent); color:var(--accent-fg)}
  .btn-ghost{background:transparent; color:var(--fg); border-color:var(--line)}
  .intro .fine{margin-top:16px; font-size:.74rem; color:var(--fg-mute); line-height:1.6}

  /* ---------- 시트 ---------- */
  .scrim{position:fixed; inset:0; background:rgba(3,7,16,.55); z-index:900; display:none}
  .scrim.on{display:block}
  .sheet{
    position:fixed; z-index:901; background:var(--surface); border:1px solid var(--line);
    box-shadow:var(--shadow); display:none; overflow-y:auto; overscroll-behavior:contain;
    left:0; right:0; bottom:0; max-height:86vh; border-radius:18px 18px 0 0;
    padding:16px 16px calc(22px + env(safe-area-inset-bottom,0px));
  }
  .sheet.on{display:block}
  @media (min-width:900px){
    .sheet{left:50%; right:auto; top:50%; bottom:auto; transform:translate(-50%,-50%);
      width:min(540px,92vw); max-height:86vh; border-radius:16px}
  }
  .sheet h2{margin:0 0 5px; font-size:1.15rem; letter-spacing:-.02em; padding-right:104px}
  .sheet .close{position:absolute; top:10px; right:12px}
  .sheet .favtop{position:absolute; top:10px; right:calc(12px + var(--tap) + 6px)}
  .sheet .favtop[aria-pressed="true"]{color:#f0b429; border-color:#f0b429}
  .sheet .favtop svg{width:1.15em; height:1.15em}
  .stale{
    margin-top:12px; padding:9px 12px; border-radius:11px; font-size:.78rem; line-height:1.55;
    background:var(--surface-2); border:1px dashed var(--line); color:var(--fg-dim);
  }
  .kv{display:grid; grid-template-columns:minmax(0,5.2em) minmax(0,1fr);
    gap:7px 10px; margin:14px 0 0; font-size:.88rem}
  .kv dt{color:var(--fg-mute); font-size:.78rem; padding-top:2px}
  .kv dd{margin:0; word-break:break-word; min-width:0}

  /* 상세화면 1순위 = 전화 걸기. 지도 앱은 보조. */
  .callbig{
    display:flex; align-items:center; justify-content:center; gap:9px;
    margin-top:14px; min-height:52px; border-radius:13px; text-decoration:none;
    background:var(--accent); color:var(--accent-fg); font-weight:800; font-size:1.02rem;
    border:1px solid var(--accent);
  }
  .callbig svg{width:1.15em; height:1.15em}
  .nophone{
    margin-top:14px; padding:11px 13px; border-radius:12px; font-size:.82rem; line-height:1.55;
    background:var(--surface-2); border:1px dashed var(--line); color:var(--fg-dim);
  }
  .maplinks{margin-top:12px}
  .maplinks .lbl{font-size:.75rem; color:var(--fg-mute); margin-bottom:6px}
  .links{display:flex; gap:7px; flex-wrap:wrap}
  .links a{
    flex:1 1 6em; text-align:center; text-decoration:none; padding:0 10px;
    min-height:var(--tap); display:inline-flex; align-items:center; justify-content:center;
    border-radius:11px; background:var(--surface-2); border:1px solid var(--line);
    color:var(--fg-dim); font-size:.82rem;
  }
  .links a:hover{border-color:var(--accent); color:var(--fg)}
  details.raw{margin-top:14px; border-top:1px solid var(--line); padding-top:10px}
  details.raw summary{
    cursor:pointer; font-size:.78rem; color:var(--fg-mute);
    min-height:var(--tap); display:flex; align-items:center; gap:7px; list-style:none;
  }
  details.raw summary::-webkit-details-marker{display:none}
  /* 눌러서 펼칠 수 있다는 신호(재감사 4-1 #2 — 회색 텍스트만 있어 신호가 없었음) */
  details.raw summary::before{
    content:""; flex:none; width:0; height:0; transition:transform .15s;
    border-left:5px solid currentColor;
    border-top:4px solid transparent; border-bottom:4px solid transparent;
  }
  details.raw[open] summary::before{transform:rotate(90deg)}
  details.raw .kv{margin-top:4px; font-size:.8rem}
  .notice{
    margin-top:14px; padding:10px 12px; border-radius:11px; font-size:.78rem;
    background:var(--surface-2); border:1px solid var(--line); color:var(--fg-mute); line-height:1.6;
  }

  /* 지역 선택 시트 */
  .rgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(8.5em,1fr)); gap:7px; margin-top:12px}
  .rbtn{
    min-height:var(--tap); border-radius:11px; border:1px solid var(--line);
    background:var(--surface-2); color:var(--fg); font-size:.85rem; padding:6px 9px;
    display:flex; flex-direction:column; align-items:flex-start; justify-content:center; gap:1px;
    text-align:left; min-width:0;
  }
  .rbtn:hover{border-color:var(--accent)}
  .rbtn[aria-pressed="true"]{background:var(--accent-soft); border-color:var(--accent)}
  .rbtn .rn{font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:100%}
  .rbtn .rc{font-size:.72rem; color:var(--fg-mute)}
  .backline{display:flex; align-items:center; gap:8px; margin-top:2px}
  .backbtn{
    min-height:var(--tap); padding:0 12px; border-radius:11px;
    border:1px solid var(--line); background:var(--surface-2); color:var(--fg-dim); font-size:.85rem;
  }

  footer{
    border-top:1px solid var(--line); margin-top:14px; padding:14px 2px 26px;
    font-size:.74rem; color:var(--fg-mute); line-height:1.7;
  }
  /* 인라인 링크지만 탭 타겟은 44px 이상 확보한다(재감사 4-1 #1 — 유일하게 남았던 미달).
     음수 마진으로 문단 줄높이에는 영향을 주지 않는다. */
  footer a{color:var(--fg-dim); display:inline-block; padding:13px 6px; margin:-13px 0;
    text-decoration:underline; text-underline-offset:2px}
  footer b{color:var(--fg-dim)}
  .toast{
    position:fixed; left:50%; bottom:22px; transform:translateX(-50%); z-index:950;
    background:var(--surface); border:1px solid var(--line); color:var(--fg);
    padding:10px 16px; border-radius:999px; font-size:.82rem; box-shadow:var(--shadow);
    opacity:0; pointer-events:none; transition:opacity .18s; max-width:88vw; text-align:center;
  }
  .toast.on{opacity:1}
  .leaflet-container{background:var(--surface-2); font:inherit}
  .leaflet-popup-content-wrapper,.leaflet-popup-tip{
    background:var(--surface); color:var(--fg); border:1px solid var(--line)}
  .leaflet-popup-content{margin:10px 12px; font-size:.82rem}
  .leaflet-popup-content b{display:block; margin-bottom:3px}
  .leaflet-bar a{background:var(--surface); color:var(--fg); border-color:var(--line)}
  .leaflet-bar a:hover{background:var(--surface-2)}
  @media (prefers-reduced-motion:reduce){*{transition:none !important}}
</style>
</head>
<body data-view="list">

<header id="hdr">
  <div class="bar">
    <div class="brand">
      <h1>헬스장<span class="dot">파인더</span></h1>
      <small id="dataStamp">데이터 불러오는 중…</small>
    </div>
    <button class="icon-btn" id="themeBtn" title="밝기 전환" aria-label="밝기 전환">◐</button>
  </div>

  <div class="quick">
    <button class="qbtn near" id="nearBtn" data-active="false" aria-label="내 주변에서 찾기">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M12 21s7-5.6 7-11a7 7 0 1 0-14 0c0 5.4 7 11 7 11z"/><circle cx="12" cy="10" r="2.6"/>
      </svg>
      <span class="lbl">내 주변</span>
    </button>
    <button class="qbtn region" id="regionBtn" aria-haspopup="dialog">
      <span class="lbl" id="regionLabel">지역 선택</span>

<script>
(function(){
"use strict";

/* ============ 상태 ============ */
var IDX = null;                 // index.json
var CACHE = {};                 // slug -> 시설 배열
var rows = [];                  // 현재 시도의 전체 배열
var view = [];                  // 필터 통과분
var shown = 0;
var PAGE = 40;
var MAX_MARKERS = 2500;
var activeId = null;
var here = null;                // 내 위치 [lat,lng]
var nearMode = false;           // 거리순 정렬 중인지
var map = null, layer = null, meMarker = null;
var started = false;            // 지역이 한 번이라도 로드됐는지

var S = { sido:"", sgg:"", openOnly:true, phoneOnly:false, favOnly:false };

var STATUS_CLASS = {1:"b-open", 2:"b-rest", 3:"b-closed", 4:"b-void", 5:"b-void"};

var $ = function(id){ return document.getElementById(id); };
var esc = function(s){
  return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
  });
};
var fmt = function(n){ return Number(n).toLocaleString("ko-KR"); };

/* 목록 1·2·3위가 "(유)" "(의)" "(주)" 로 시작하면 명부처럼 보인다.
   화면에는 법인격 표기를 뗀 상호를 쓰고, 등록 상호는 상세의 "원본 정보"에 그대로 남긴다.
   (검색은 원본 상호(r.n)로 하므로 "주식회사"로도 계속 찾힌다.) */
var CORP_PRE = /^\s*(\(주\)|\(유\)|\(의\)|\(재\)|\(사\)|\(합\)|주식회사|유한회사|유한책임회사|합자회사|의료법인|재단법인|사단법인|사회복지법인|학교법인)\s*/;
var CORP_POST = /\s*(\(주\)|\(유\)|주식회사)\s*$/;
function dispName(n){
  var s = String(n == null ? "" : n).replace(CORP_PRE, "").replace(CORP_POST, "").trim();
  return s || String(n == null ? "" : n);   // 전부 지워지면 원본을 그대로 쓴다
}

var SVG_PHONE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"' +
  ' stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
  '<path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.2a2 2 0 0 1 2.1-.5c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/></svg>';

function starSvg(on){
  return '<svg viewBox="0 0 24 24" fill="' + (on ? "currentColor" : "none") +
    '" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true">' +
    '<path d="M12 3.6l2.6 5.3 5.8.85-4.2 4.1 1 5.8-5.2-2.75-5.2 2.75 1-5.8-4.2-4.1 5.8-.85z"/></svg>';
}

/* 스토어 앱(TWA)으로 설치돼 실행 중인가 — 위치 권한 재허용 안내 문구가 갈린다.
   설치 앱에는 주소창이 없어 '자물쇠 아이콘' 안내가 오안내가 된다(재감사 4-1 #4). */
function isStandalone(){
  try{
    return (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches) ||
           window.navigator.standalone === true ||
           String(document.referrer || "").indexOf("android-app://") === 0;
  }catch(e){ return false; }
}
function permHelp(){
  return isStandalone()
    ? "휴대폰 <b>설정 &gt; 앱 &gt; 헬스장파인더 &gt; 권한 &gt; 위치</b>에서 다시 켤 수 있습니다."
    : "주소창의 자물쇠(또는 ⓘ) 아이콘 &gt; <b>권한</b>에서 위치를 다시 켤 수 있습니다.";
}

/* ============ 즐겨찾기 (이 기기에만 저장) ============
   저장 시점 스냅샷을 함께 남겨, 해당 시도 데이터를 못 불러와도 목록이 비지 않게 한다.
   단 최신 데이터를 받을 수 있으면 항상 그쪽을 우선한다(스냅샷은 낡을 수 있으므로). */
var FAV_KEY = "gf.fav", FAV_MAX = 300;
var favIds = null;
function loadFavs(){
  try{
    var a = JSON.parse(localStorage.getItem(FAV_KEY) || "[]");
    return Array.isArray(a) ? a.filter(function(f){ return f && f.i; }) : [];
  }catch(e){ return []; }
}
function saveFavs(a){
  try{ localStorage.setItem(FAV_KEY, JSON.stringify(a.slice(0, FAV_MAX))); }catch(e){}
}
function favSet(){
  if(!favIds){
    favIds = {};
    loadFavs().forEach(function(f){ favIds[f.i] = 1; });
  }
  return favIds;
}
function isFav(r){ return !!(r && favSet()[r.i]); }
function snapOf(r){
  var o = {};
  ["i","n","a","u","c","s","y","x","p","pe","d","e"].forEach(function(k){
    if(r[k] != null) o[k] = r[k];
  });
  return o;
}
function toggleFav(r){
  var a = loadFavs(), idx = -1, i;
  for(i = 0; i < a.length; i++) if(a[i].i === r.i){ idx = i; break; }
  if(idx >= 0){
    a.splice(idx, 1);
    delete favSet()[r.i];
  }else{
    a.unshift({ i:r.i, slug:r._slug || S.sido, t:Date.now(), snap:snapOf(r) });
    favSet()[r.i] = 1;
  }
  saveFavs(a);
  updateFavCount();
  return idx < 0;   // true = 방금 추가됨
}
function updateFavCount(){
  var el = $("favCnt");
  if(el){
    var c = loadFavs().length;
    el.textContent = c ? String(c) : "";
  }
}

/* 원본 전화번호는 구분기호 없이 들어온다(예: 025867721). 숫자는 그대로 두고 보기 좋게만 끊는다. */
function fmtPhone(p){
  var d = String(p).replace(/[^0-9]/g, "");
  if(d.slice(0, 2) === "02"){
    if(d.length === 9)  return d.slice(0,2) + "-" + d.slice(2,5) + "-" + d.slice(5);
    if(d.length === 10) return d.slice(0,2) + "-" + d.slice(2,6) + "-" + d.slice(6);
  }
  if(d.length === 10) return d.slice(0,3) + "-" + d.slice(3,6) + "-" + d.slice(6);
  if(d.length === 11) return d.slice(0,3) + "-" + d.slice(3,7) + "-" + d.slice(7);
  if(d.length === 8)  return d.slice(0,4) + "-" + d.slice(4);
  if(d.length === 7)  return d.slice(0,3) + "-" + d.slice(3);
  return p;
}
function fmtDist(km){
  if(km == null || !isFinite(km)) return "";
  return km < 1 ? Math.round(km * 1000) + "m" : km.toFixed(1) + "km";
}

/* ============ 초성 검색 ============ */
var CHO = ["ㄱ","ㄲ","ㄴ","ㄷ","ㄸ","ㄹ","ㅁ","ㅂ","ㅃ","ㅅ","ㅆ","ㅇ","ㅈ","ㅉ","ㅊ","ㅋ","ㅌ","ㅍ","ㅎ"];
function toCho(s){
  var out = "", i, c;
  for(i = 0; i < s.length; i++){
    c = s.charCodeAt(i);
    if(c >= 0xAC00 && c <= 0xD7A3) out += CHO[Math.floor((c - 0xAC00) / 588)];
    else out += s[i];
  }
  return out;
}
var CHO_ONLY = /^[ㄱ-ㅎ\s]+$/;

/* ============ 거리 ============ */
function distKm(a, b, c, d){
  var R = 6371, p = Math.PI / 180;
  var dLat = (c - a) * p, dLng = (d - b) * p;
  var h = Math.sin(dLat/2)*Math.sin(dLat/2) +
          Math.cos(a*p)*Math.cos(c*p)*Math.sin(dLng/2)*Math.sin(dLng/2);
  return 2 * R * Math.asin(Math.min(1, Math.sqrt(h)));
}

/* ============ 토스트 ============ */
var toastT = null;
function toast(msg){
  var el = $("toast");
  el.textContent = msg;
  el.classList.add("on");
  clearTimeout(toastT);
  toastT = setTimeout(function(){ el.classList.remove("on"); }, 2800);
}

/* ============ 테마 ============ */
function initTheme(){
  var saved = null;
  try{ saved = localStorage.getItem("gf.theme"); }catch(e){}
  if(!saved){
    saved = (window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches)
      ? "light" : "dark";
  }
  setTheme(saved);
}
function setTheme(t){
  document.documentElement.setAttribute("data-theme", t);
  document.querySelector('meta[name="theme-color"]')
    .setAttribute("content", t === "light" ? "#ffffff" : "#0f172a");
  try{ localStorage.setItem("gf.theme", t); }catch(e){}
}
$("themeBtn").addEventListener("click", function(){
  setTheme(document.documentElement.getAttribute("data-theme") === "light" ? "dark" : "light");
});

/* ============ 레이어(시트) + 안드로이드 뒤로가기 ============
   시트가 열려 있을 때 기기 뒤로가기는 앱을 나가는 게 아니라 시트만 닫아야 한다. */
var layerOpen = null;   // "detail" | "region" | null
function openLayer(kind){
  if(!layerOpen){
    try{ history.pushState({ gfLayer:1 }, ""); }catch(e){}
  }
  layerOpen = kind;
  $("scrim").classList.add("on");
}
function hideLayers(){
  $("sheet").classList.remove("on");
  $("regionSheet").classList.remove("on");
  $("scrim").classList.remove("on");
}
function closeLayer(fromPop){
  if(!layerOpen){ hideLayers(); return; }
  layerOpen = null;
  hideLayers();
  if(!fromPop){
    try{ history.back(); }catch(e){}
  }
}
window.addEventListener("popstate", function(){
  if(layerOpen) closeLayer(true);
});

/* ============ 부트 ============ */
fetch("data/index.json")
  .then(function(r){
    if(!r.ok) throw new Error("index.json " + r.status);
    return r.json();
  })
  .then(function(j){ IDX = j; boot(); })
  .catch(function(e){
    $("listItems").innerHTML =
      '<div class="empty"><b>데이터를 불러오지 못했습니다</b>' + esc(e.message) + "</div>";
  });

function boot(){
  /* 헤드라인은 '영업중' 기준으로 정직하게. 전체 30,375곳에는 폐업 12,143곳이 섞여 있다. */
  $("dataStamp").innerHTML =
    "<span>영업중 " + fmt(IDX.totalOpen) + "곳</span> · <span>기준 " +
    esc((IDX.sourceUpdatedAt || "").slice(0, 10)) + "</span>";
  var dead = IDX.total - IDX.totalOpen;
  $("footStats").innerHTML =
    "수록 " + fmt(IDX.total) + "곳 = 영업중 <b>" + fmt(IDX.totalOpen) + "</b>곳 + 폐업·휴업·말소 " +
    fmt(dead) + "곳. 기본 화면은 영업중만 보여줍니다." +
    (IDX.phone ? " 영업중 시설의 전화번호 보유율 " +
      fmt(IDX.phone.openWithPhone) + "/" + fmt(IDX.phone.openTotal) + "곳(" +
      (100 - IDX.phone.missingPct).toFixed(1) + "%)." : "");

  buildChips();

  $("q").addEventListener("input", debounce(refresh, 160));
  $("tabList").addEventListener("click", function(){ setView("list"); });
  $("tabMap").addEventListener("click", function(){ setView("map"); });
  $("nearBtn").addEventListener("click", function(){ nearMe(false); });
  $("regionBtn").addEventListener("click", function(){ openRegionSheet(); });
  $("scrim").addEventListener("click", function(){ closeLayer(false); });
  document.addEventListener("keydown", function(e){
    if(e.key === "Escape" && layerOpen) closeLayer(false);
  });

  initMap();
  watchChipOverflow();
  watchHeaderCompact();
  decideStart();
}

function setNearActive(on){
  var b = $("nearBtn");
  b.dataset.active = on ? "true" : "false";
  b.setAttribute("aria-label", on
    ? "내 주변 — 가까운 순으로 보고 있습니다. 다시 누르면 위치를 새로 잡습니다"
    : "내 주변에서 찾기");
}

function debounce(fn, ms){
  var t = null;
  return function(){ clearTimeout(t); t = setTimeout(fn, ms); };
}

/* ---- 업종·조건 칩 ---- */
function divChip(chips){
  var d = document.createElement("div");
  d.className = "chipdiv";
  d.setAttribute("aria-hidden", "true");
  chips.appendChild(d);
}

function buildChips(){
  var chips = $("catChips");

  /* 재방문 이유 — 저장한 곳을 맨 앞에 둔다 */
  var fv = document.createElement("button");
  fv.className = "chip"; fv.id = "favToggle";
  fv.setAttribute("aria-pressed", "false");
  fv.innerHTML = '\u2605 저장한 곳<span class="cnt" id="favCnt"></span>';
  fv.addEventListener("click", function(){ setFavMode(!S.favOnly); });
  chips.appendChild(fv);
  divChip(chips);

  IDX.categories.forEach(function(name, i){
    var b = document.createElement("button");
    b.className = "chip";
    b.dataset.cat = i;
    b.setAttribute("aria-pressed", "true");
    b.innerHTML = esc(name) + '<span class="cnt">' + fmt(IDX.byCategory[i].open) + "</span>";
    b.addEventListener("click", function(){
      var on = b.getAttribute("aria-pressed") === "true";
      if(on && chips.querySelectorAll("[data-cat][aria-pressed=\"true\"]").length === 1) return;
      b.setAttribute("aria-pressed", on ? "false" : "true");
      refresh();
    });
    chips.appendChild(b);
  });

  divChip(chips);

  var st = document.createElement("button");
  st.className = "chip"; st.id = "statusToggle";
  st.setAttribute("aria-pressed", "true");
  st.textContent = "영업중만";
  st.addEventListener("click", function(){
    S.openOnly = !S.openOnly;
    st.setAttribute("aria-pressed", String(S.openOnly));
    st.textContent = S.openOnly ? "영업중만" : "전체 상태";
    refresh();
  });
  chips.appendChild(st);

  /* 전화번호 결측이 많다는 사실을 숨기지 않고, 대신 '걸 수 있는 곳만' 고르게 해준다. */
  var ph = document.createElement("button");
  ph.className = "chip"; ph.id = "phoneToggle";
  ph.setAttribute("aria-pressed", "false");
  ph.textContent = "전화 있는 곳만";
  ph.addEventListener("click", function(){
    S.phoneOnly = !S.phoneOnly;
    ph.setAttribute("aria-pressed", String(S.phoneOnly));
    refresh();
  });
  chips.appendChild(ph);
  updateFavCount();
}

/* 즐겨찾기 모드 — 시도 경계를 넘어 저장한 곳만 모아 보여준다. */
function setFavMode(on){
  S.favOnly = on;
  $("favToggle").setAttribute("aria-pressed", String(on));
  if(on){
    setNearActive(false);
    nearMode = false;
    loadFavRows();
  }else if(S.sido){
    loadRegion(S.sido);
  }else{
    started = false;
    showIntro("prompt");
  }
  updateRegionLabel();
}

function ensureRegion(slug){
  if(CACHE[slug]) return Promise.resolve(CACHE[slug]);
  return fetch("data/regions/" + slug + ".json").then(function(r){
    if(!r.ok) throw new Error(slug + ".json " + r.status);
    return r.json();
  }).then(function(arr){
    arr.forEach(function(x){ x._slug = slug; });
    CACHE[slug] = arr;
    return arr;
  });
}

function loadFavRows(){
  var favs = loadFavs();
  started = true;
  if(!favs.length){ rows = []; refresh(); return; }

  $("listItems").innerHTML = '<div class="empty">저장한 곳 불러오는 중…</div>';
  var slugs = {};
  favs.forEach(function(f){ if(f.slug) slugs[f.slug] = 1; });

  Promise.all(Object.keys(slugs).map(function(sl){
    return ensureRegion(sl).catch(function(){ return null; });
  })).then(function(){
    rows = favs.map(function(f){
      var arr = CACHE[f.slug] || [], i;
      for(i = 0; i < arr.length; i++) if(arr[i].i === f.i) return arr[i];
      // 최신 데이터를 못 받았을 때만 저장 시점 스냅샷을 쓴다(그 사실을 화면에 밝힌다).
      var snap = f.snap || { i:f.i, n:"(저장 정보 없음)", a:"", u:"", c:0, s:1 };
      snap._stale = 1;
      snap._slug = f.slug;
      return snap;
    });
    refresh();
  });
}

/* 업종 칩 행이 잘려 있으면 오른쪽 페이드로 알린다 */
function watchChipOverflow(){
  var wrap = $("chipsWrap"), el = $("catChips");
  function upd(){
    wrap.dataset.more = (el.scrollWidth - el.clientWidth - el.scrollLeft > 4) ? "1" : "0";
    wrap.dataset.back = (el.scrollLeft > 4) ? "1" : "0";
  }
  el.addEventListener("scroll", upd, { passive:true });
  window.addEventListener("resize", upd);
  if(window.ResizeObserver) new ResizeObserver(upd).observe(el);
  upd();
}

/* 목록을 내리면 헤더를 접어 화면을 돌려준다 (히스테리시스로 깜빡임 방지) */
function watchHeaderCompact(){
  var wrap = $("listWrap"), hdr = $("hdr");
  wrap.addEventListener("scroll", function(){
    var t = wrap.scrollTop;
    if(t > 90) hdr.classList.add("compact");
    else if(t < 30) hdr.classList.remove("compact");
  }, { passive:true });
}

/* ============ 첫 화면 결정 ============
   위치 권한이 이미 허용돼 있으면 묻지 않고 바로 '내 주변 거리순'.
   아니면 지역을 고르게 안내한다. (서울 가나다순 명부를 들이밀지 않는다.) */
function decideStart(){
  var saved = null;
  try{ saved = localStorage.getItem("gf.sido"); }catch(e){}
  var valid = saved && IDX.regions.some(function(r){ return r.slug === saved; });

  function fallback(state){
    if(valid){ loadRegion(saved); }
    else showIntro(state || "prompt");
  }

  if(navigator.permissions && navigator.permissions.query){
    navigator.permissions.query({ name:"geolocation" }).then(function(st){
      if(st.state === "granted") nearMe(true);
      else fallback(st.state);
    }).catch(function(){ fallback("prompt"); });
  }else{
    fallback("prompt");
  }
}

function showIntro(state){
  var denied = state === "denied";
  $("listItems").innerHTML =
    '<div class="intro">' +
      '<svg class="ill" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"' +
      ' stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
      '<path d="M12 21s7-5.6 7-11a7 7 0 1 0-14 0c0 5.4 7 11 7 11z"/><circle cx="12" cy="10" r="2.6"/></svg>' +
      "<h2>" + (denied ? "지역을 골라주세요" : "가까운 곳부터 볼까요?") + "</h2>" +
      "<p>" + (denied
        ? "위치 권한이 꺼져 있어 거리순으로 보여드릴 수 없습니다. 아래에서 지역을 고르면 바로 목록이 나옵니다.<br>" + permHelp()
        : "위치를 켜면 지금 있는 곳에서 <b>가까운 순서</b>로 보여드립니다. 위치는 이 기기 안에서만 쓰이고 어디에도 전송하지 않습니다.") + "</p>" +
      '<div class="btns">' +
        (denied ? "" :
          '<button class="btn-primary" id="introNear">' +
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"' +
          ' stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="width:1.1em;height:1.1em">' +
          '<path d="M12 21s7-5.6 7-11a7 7 0 1 0-14 0c0 5.4 7 11 7 11z"/><circle cx="12" cy="10" r="2.6"/></svg>' +
          "내 주변에서 찾기</button>") +
        '<button class="btn-ghost" id="introRegion">지역으로 찾기</button>' +
        (loadFavs().length
          ? '<button class="btn-ghost" id="introFav">\u2605 저장한 곳 ' +
            loadFavs().length + "곳 보기</button>"
          : "") +
      "</div>" +
      '<p class="fine">행정안전부 인허가 데이터 기준 전국 영업중 ' + fmt(IDX.totalOpen) +
      "곳. 이용료·운영시간·후기는 원본에 없어 제공하지 않습니다.</p>" +
    "</div>";
  var n = $("introNear");
  if(n) n.addEventListener("click", function(){ nearMe(false); });
  $("introRegion").addEventListener("click", function(){ openRegionSheet(); });
  var fi = $("introFav");
  if(fi) fi.addEventListener("click", function(){ setFavMode(true); });
  $("countLine").innerHTML = "시작하려면 위치 또는 지역을 골라주세요";
}

function setView(v){
  document.body.dataset.view = v;
  $("tabList").setAttribute("aria-pressed", String(v === "list"));
  $("tabMap").setAttribute("aria-pressed", String(v === "map"));
  if(v === "map" && map){
    setTimeout(function(){ map.invalidateSize(); applyFit(); }, 40);
  }
}

/* ============ 지도 ============ */
function initMap(){
  map = L.map("map", { preferCanvas:true, zoomControl:true, attributionControl:true })
        .setView([36.5, 127.8], 7);
  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom: 19,
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
  }).addTo(map);
  layer = L.layerGroup().addTo(map);
  // 헤더가 접히거나 글자 크기가 바뀌면 지도 크기도 다시 잰다.
  if(window.ResizeObserver){
    new ResizeObserver(function(){ if(map) map.invalidateSize(); }).observe($("mapPane"));
  }
}

var STATUS_COLOR = {1:"#34d399", 2:"#fbbf24", 3:"#f87171", 4:"#94a3b8", 5:"#94a3b8"};

var pendingFit = null;
function mapVisible(){
  var el = $("mapPane");
  return !!(el.offsetWidth && el.offsetHeight);
}
function applyFit(){
  if(!pendingFit || !pendingFit.length || !map) return;
  map.fitBounds(pendingFit, {
    padding: [26, 26],
    maxZoom: pendingFit.length === 1 ? 16 : 15
  });
  pendingFit = null;
}

function drawMap(){
  if(!map) return;
  layer.clearLayers();
  var pts = view.filter(function(r){ return r.y != null; });
  var capped = pts.length > MAX_MARKERS;
  var use = capped ? pts.slice(0, MAX_MARKERS) : pts;
  var bounds = [];

  use.forEach(function(r){
    var m = L.circleMarker([r.y, r.x], {
      radius: 5, weight: 1.5, color: STATUS_COLOR[r.s] || "#94a3b8",
      fillColor: STATUS_COLOR[r.s] || "#94a3b8", fillOpacity: .55
    });
    m.bindPopup("<b>" + esc(dispName(r.n)) + "</b>" + esc(r.a));
    m.on("click", function(){ openSheet(r); });
    m.addTo(layer);
    bounds.push([r.y, r.x]);
  });

  var hint = $("mapHint");
  var noCoord = view.length - pts.length;
  var msgs = [];
  if(nearMode && here && pts.length > 20)
    msgs.push("내 위치 주변에 맞췄습니다. 지도를 줄이면 더 넓게 보입니다.");
  if(capped) msgs.push("지도에는 " + fmt(MAX_MARKERS) + "곳까지만 표시합니다. 지역·검색을 좁혀보세요.");
  if(noCoord > 0) msgs.push("원본에 좌표가 없는 " + fmt(noCoord) + "곳은 목록에만 나옵니다.");
  if(msgs.length){ hint.textContent = msgs.join(" "); hint.hidden = false; }
  else hint.hidden = true;

  if(bounds.length){
    if(nearMode && here && bounds.length > 1){
      // 거리순으로 정렬돼 있으므로 앞쪽 20곳 + 내 위치만 담아 '동네' 단위로 맞춘다.
      // (예전엔 시도 전체 4,710점에 맞춰 서울 전역이 초록 덩어리로 보였다 — 재감사 4-1 #7)
      var nb = bounds.slice(0, 20);
      nb.push(here);
      pendingFit = nb;
    }else{
      pendingFit = bounds;
    }
    if(mapVisible()) applyFit();
  }
  if(here){
    if(meMarker) map.removeLayer(meMarker);
    meMarker = L.circleMarker(here, {
      radius:8, weight:3, color:"#3b82f6", fillColor:"#3b82f6", fillOpacity:.35
    }).bindPopup("내 위치").addTo(map);
  }
}

/* ============ 지역 로드 ============ */
function regionOf(slug){
  return IDX.regions.filter(function(r){ return r.slug === slug; })[0] || null;
}

function loadRegion(slug, then){
  var reg = regionOf(slug);
  if(!reg) return;
  S.sido = slug;
  started = true;
  try{ localStorage.setItem("gf.sido", slug); }catch(e){}
  updateRegionLabel();

  if(CACHE[slug]){ rows = CACHE[slug]; refresh(); if(then) then(); return; }

  $("listItems").innerHTML = '<div class="empty">' + esc(reg.name) + " 불러오는 중…</div>";
  fetch("data/regions/" + slug + ".json")
    .then(function(r){
      if(!r.ok) throw new Error(slug + ".json " + r.status);
      return r.json();
    })
    .then(function(arr){
      // 즐겨찾기가 어느 시도 파일에서 왔는지 기억해 둔다(시도 경계를 넘어 복원하기 위함)
      arr.forEach(function(x){ x._slug = slug; });
      CACHE[slug] = arr; rows = arr; refresh(); if(then) then();
    })
    .catch(function(e){
      $("listItems").innerHTML =
        '<div class="empty"><b>지역 데이터를 불러오지 못했습니다</b>' + esc(e.message) + "</div>";
    });
}

function updateRegionLabel(){
  if(S.favOnly){ $("regionLabel").textContent = "저장한 곳 보는 중"; return; }
  var reg = regionOf(S.sido);
  $("regionLabel").textContent = reg
    ? (reg.name + (S.sgg ? " · " + S.sgg : ""))
    : "지역 선택";
}

/* ---- 지역 선택 시트 (시도 -> 시군구 2단계) ---- */
function openRegionSheet(step){
  var el = $("regionSheet");
  var html = '<button class="icon-btn close" id="regionClose" aria-label="닫기">✕</button>';

  if(step === "sgg" && regionOf(S.sido)){
    var reg = regionOf(S.sido);
    html += '<h2>' + esc(reg.name) + "</h2>" +
      '<div class="backline"><button class="backbtn" id="regionBack">← 다른 시·도</button></div>' +
      '<div class="rgrid">' +
      '<button class="rbtn" data-sgg="" aria-pressed="' + (S.sgg ? "false" : "true") + '">' +
      '<span class="rn">전체</span><span class="rc">영업중 ' + fmt(reg.open) + "곳</span></button>" +
      reg.sigungu.map(function(s){
        return '<button class="rbtn" data-sgg="' + esc(s.name) + '" aria-pressed="' +
          (S.sgg === s.name ? "true" : "false") + '"><span class="rn">' + esc(s.name) +
          '</span><span class="rc">영업중 ' + fmt(s.open) + "곳</span></button>";
      }).join("") + "</div>";
  }else{
    html += "<h2>지역 선택</h2>" +
      '<div class="rgrid">' + IDX.regions.map(function(r){
        return '<button class="rbtn" data-sido="' + esc(r.slug) + '" aria-pressed="' +
          (S.sido === r.slug ? "true" : "false") + '"><span class="rn">' + esc(r.name) +
          '</span><span class="rc">영업중 ' + fmt(r.open) + "곳</span></button>";
      }).join("") + "</div>" +
      '<div class="notice">지금 있는 곳에서 가까운 순으로 보고 싶다면 헤더의 <b>내 주변</b> 버튼을 눌러주세요.</div>';
  }

  el.innerHTML = html;
  el.classList.add("on");
  el.scrollTop = 0;
  openLayer("region");

  $("regionClose").addEventListener("click", function(){ closeLayer(false); });
  var back = $("regionBack");
  if(back) back.addEventListener("click", function(){ openRegionSheet(); });

  Array.prototype.forEach.call(el.querySelectorAll("[data-sido]"), function(b){
    b.addEventListener("click", function(){
      var slug = b.dataset.sido;
      if(slug !== S.sido){ S.sgg = ""; }
      nearMode = false;
      setNearActive(false);
      if(S.favOnly){
        S.favOnly = false;
        $("favToggle").setAttribute("aria-pressed", "false");
      }
      loadRegion(slug, function(){ openRegionSheet("sgg"); });
      if(CACHE[slug]) openRegionSheet("sgg");
    });
  });
  Array.prototype.forEach.call(el.querySelectorAll("[data-sgg]"), function(b){
    b.addEventListener("click", function(){
      S.sgg = b.dataset.sgg;
      updateRegionLabel();
      closeLayer(false);
      refresh();
    });
  });
}

/* ============ 필터 ============ */
function refresh(){
  if(!started) return;
  var q = $("q").value.trim();
  var cats = {};
  Array.prototype.forEach.call($("catChips").querySelectorAll("[data-cat]"), function(b){
    if(b.getAttribute("aria-pressed") === "true") cats[b.dataset.cat] = 1;
  });

  var isCho = q && CHO_ONLY.test(q);
  var needle = q.toLowerCase().replace(/\s+/g, "");
  var choNeedle = isCho ? q.replace(/\s+/g, "") : "";

  view = rows.filter(function(r){
    if(!cats[r.c]) return false;
    if(S.openOnly && r.s !== 1) return false;
    if(S.phoneOnly && !r.p) return false;
    if(S.sgg && !S.favOnly && r.u !== S.sgg) return false;
    if(!q) return true;
    if(isCho) return toCho(r.n).replace(/\s+/g, "").indexOf(choNeedle) >= 0;
    return r.n.toLowerCase().replace(/\s+/g, "").indexOf(needle) >= 0 ||
           r.a.toLowerCase().indexOf(needle) >= 0;
  });

  if(here){
    view.forEach(function(r){
      r._d = (r.y == null) ? Infinity : distKm(here[0], here[1], r.y, r.x);
    });
    view.sort(function(a, b){ return a._d - b._d; });
  }

  var open = 0, withPhone = 0, i;
  for(i = 0; i < view.length; i++){
    if(view[i].s === 1) open++;
    if(view[i].p) withPhone++;
  }
  var parts = [];
  if(S.favOnly) parts.push("저장한 곳");
  if(nearMode && here) parts.push("가까운 순");
  parts.push("<b>" + fmt(view.length) + "</b>곳");
  if(!S.openOnly) parts.push("영업중 <b>" + fmt(open) + "</b>");
  if(!S.phoneOnly && view.length) parts.push("전화 <b>" + fmt(withPhone) + "</b>");
  $("countLine").innerHTML = parts.join(" · ");

  shown = 0;
  $("listItems").innerHTML = "";
  $("listWrap").scrollTop = 0;
  $("hdr").classList.remove("compact");
  renderMore();
  drawMap();
}

function statusLabel(r){
  return (IDX.statusLabels && IDX.statusLabels[r.s]) || "확인필요";
}

function renderMore(){
  var wrap = $("listItems");
  var old = wrap.querySelector(".more");
  if(old) old.remove();

  if(!view.length){
    wrap.innerHTML = '<div class="empty"><b>' +
      (S.favOnly && !loadFavs().length ? "저장한 곳이 아직 없습니다" : "조건에 맞는 시설이 없습니다") + "</b>" +
      (S.favOnly && !loadFavs().length
        ? "목록이나 상세에서 <b>★ 저장</b>을 누르면 여기에 모입니다. 이 기기에만 저장되고 서버로 보내지 않습니다."
        : S.phoneOnly
        ? "‘전화 있는 곳만’을 끄면 더 많이 보입니다. 원본 인허가 데이터에 전화번호가 없는 시설이 많습니다."
        : "검색어를 줄이거나 상태 필터를 ‘전체 상태’로 바꿔보세요.") + "</div>";
    return;
  }

  var frag = document.createDocumentFragment();
  var end = Math.min(shown + PAGE, view.length);
  for(var i = shown; i < end; i++){
    var r = view[i];
    var card = document.createElement("div");
    card.className = "card" + (r.i === activeId ? " active" : "");

    var meta = [];
    if(r._d != null && isFinite(r._d)) meta.push('<span class="d">' + esc(fmtDist(r._d)) + "</span>");
    meta.push(esc(IDX.categories[r.c]));
    if(r.y == null) meta.push("좌표없음");

    var b = document.createElement("button");
    b.className = "cardmain";
    b.dataset.idx = i;
    b.innerHTML =
      '<div class="top"><span class="name">' + esc(dispName(r.n)) + "</span>" +
      '<span class="badge ' + STATUS_CLASS[r.s] + '">' + esc(statusLabel(r)) + "</span></div>" +
      '<div class="addr">' + esc(r.a) + "</div>" +
      '<div class="meta">' + meta.join(" · ") + "</div>";
    b.addEventListener("click", function(){ openSheet(view[+this.dataset.idx]); });
    card.appendChild(b);

    card.appendChild(makeFavBtn(r));

    if(r.p){
      var a = document.createElement("a");
      a.className = "cardact callbtn";
      a.href = "tel:" + String(r.p).replace(/[^0-9+]/g, "");
      a.setAttribute("aria-label", dispName(r.n) + " 전화 걸기 " + fmtPhone(r.p));
      a.innerHTML = SVG_PHONE + "<span>전화</span>";
      card.appendChild(a);
    }
    frag.appendChild(card);
  }
  wrap.appendChild(frag);
  shown = end;

  if(shown < view.length){
    var more = document.createElement("button");
    more.className = "more";
    more.textContent = "더 보기 (" + fmt(view.length - shown) + "곳 남음)";
    more.addEventListener("click", renderMore);
    wrap.appendChild(more);
  }
}

function makeFavBtn(r){
  var on = isFav(r);
  var b = document.createElement("button");
  b.className = "cardact favbtn";
  function paint(v){
    b.setAttribute("aria-pressed", String(v));
    b.innerHTML = starSvg(v) + "<span>" + (v ? "저장됨" : "저장") + "</span>";
    b.setAttribute("aria-label", dispName(r.n) + (v ? " 즐겨찾기 해제" : " 즐겨찾기 저장"));
  }
  paint(on);
  b.addEventListener("click", function(e){
    e.stopPropagation();
    var now = toggleFav(r);
    paint(now);
    toast(now ? "저장했습니다. ‘저장한 곳’에서 다시 볼 수 있습니다." : "저장을 해제했습니다");
    if(S.favOnly && !now) loadFavRows();   // 즐겨찾기 화면에서 뺐으면 목록에서도 즉시 제거
  });
  return b;
}

$("listWrap").addEventListener("scroll", function(){
  var el = this;
  if(shown < view.length && el.scrollTop + el.clientHeight > el.scrollHeight - 320) renderMore();
});

/* ============ 상세 ============
   1순위는 앱 안에서 끝나는 행동(전화 걸기). 지도 앱은 보조 링크로 내린다. */
function openSheet(r){
  if(!r) return;
  activeId = r.i;
  var mapq = encodeURIComponent(r.n + " " + r.a);

  var kv = [
    ["업종", IDX.categories[r.c]],
    ["영업상태", statusLabel(r) + (r.e ? " (" + r.e + ")" : "")],
    ["주소", r.a],
    ["시군구", r.u]
  ];
  if(r._d != null && isFinite(r._d)) kv.push(["거리", fmtDist(r._d)]);

  var head =
    '<button class="icon-btn close" id="sheetClose" aria-label="닫기">✕</button>' +
    '<button class="icon-btn favtop" id="sheetFav" aria-pressed="' + isFav(r) + '">' +
      starSvg(isFav(r)) + "</button>" +
    '<h2 id="sheetName">' + esc(dispName(r.n)) + "</h2>" +
    '<span class="badge ' + STATUS_CLASS[r.s] + '">' + esc(statusLabel(r)) + "</span>" +
    (r._stale
      ? '<div class="stale">저장할 때 받아둔 정보입니다. 최신 데이터를 불러오지 못해 ' +
        "영업상태가 지금과 다를 수 있습니다.</div>"
      : "");

  var action;
  if(r.p){
    action = '<a class="callbig" href="tel:' + esc(String(r.p).replace(/[^0-9+]/g, "")) + '">' +
      SVG_PHONE + "전화 걸기 " + esc(fmtPhone(r.p)) + "</a>" +
      (r.pe ? '<div class="notice">이 번호는 같은 사업장이 함께 신고한 다른 체육시설업 인허가에서 ' +
        "가져왔습니다(상호·주소가 완전히 일치하는 건만). 원본 체력단련장업 기록에는 번호가 비어 있습니다.</div>" : "");
  }else{
    action = '<div class="nophone"><b>전화번호가 원본에 없습니다.</b><br>' +
      "행정안전부 인허가 서식에서 전화번호는 필수 항목이 아니라 " +
      (IDX.phone ? "영업중 시설의 " + IDX.phone.missingPct + "%" : "상당수") +
      "가 비어 있습니다. 없는 번호를 지어내지 않기 위해 빈칸으로 둡니다. " +
      "아래 지도 앱에서 상호로 찾아보세요.</div>";
  }

  var links =
    '<div class="maplinks"><div class="lbl">지도 앱에서 열기 (길찾기·로드뷰)</div><div class="links">' +
    '<a href="https://map.kakao.com/?q=' + mapq + '" target="_blank" rel="noopener">카카오맵</a>' +
    '<a href="https://map.naver.com/p/search/' + mapq + '" target="_blank" rel="noopener">네이버지도</a>' +
    '<a href="https://www.google.com/maps/search/?api=1&query=' + mapq + '" target="_blank" rel="noopener">구글맵</a>' +
    "</div></div>";

  /* 관리번호·인허가일은 행정 내부 값이다. 기본은 접어둔다. */
  var raw = "<details class=\"raw\"><summary>원본 정보 (행정 데이터)</summary><dl class=\"kv\">" +
    (dispName(r.n) !== r.n ? "<dt>등록 상호</dt><dd>" + esc(r.n) + "</dd>" : "") +
    "<dt>인허가일</dt><dd>" + esc(r.d || "-") + "</dd>" +
    "<dt>관리번호</dt><dd>" + esc(r.i) + "</dd>" +
    "</dl></details>";

  $("sheet").innerHTML = head + action +
    '<dl class="kv">' + kv.map(function(p){
      return "<dt>" + esc(p[0]) + "</dt><dd>" + esc(p[1]) + "</dd>";
    }).join("") + "</dl>" + links + raw +
    '<div class="notice">이용료·운영시간·사진·평점은 행정안전부 인허가 데이터에 없어 표시하지 않습니다. ' +
    "영업상태는 지자체 신고 기준이라 실제와 다를 수 있으니 방문 전 확인하세요." +
    (r.y == null ? " 이 시설은 원본에 좌표가 없어 지도에 표시되지 않습니다." : "") + "</div>";

  $("sheetClose").addEventListener("click", function(){ closeLayer(false); });
  (function(){
    var fb = $("sheetFav");
    function paint(v){
      fb.setAttribute("aria-pressed", String(v));
      fb.innerHTML = starSvg(v);
      fb.setAttribute("aria-label", v ? "즐겨찾기 해제" : "즐겨찾기 저장");
    }
    paint(isFav(r));
    fb.addEventListener("click", function(){
      var now = toggleFav(r);
      paint(now);
      toast(now ? "저장했습니다. ‘저장한 곳’에서 다시 볼 수 있습니다." : "저장을 해제했습니다");
      // 목록 카드의 별도 즉시 맞춰준다
      Array.prototype.forEach.call(document.querySelectorAll(".cardmain"), function(c){
        var rec = view[+c.dataset.idx];
        if(rec && rec.i === r.i){
          var b = c.parentNode.querySelector(".favbtn");
          if(b){
            b.setAttribute("aria-pressed", String(now));
            b.innerHTML = starSvg(now) + "<span>" + (now ? "저장됨" : "저장") + "</span>";
          }
        }
      });
    });
  })();
  $("sheet").classList.add("on");
  $("sheet").scrollTop = 0;
  openLayer("detail");

  Array.prototype.forEach.call(document.querySelectorAll(".cardmain"), function(c){
    var rec = view[+c.dataset.idx];
    c.parentNode.classList.toggle("active", !!rec && rec.i === r.i);
  });
  if(r.y != null && map && document.body.dataset.view === "map"){
    map.setView([r.y, r.x], Math.max(map.getZoom(), 15));
  }
}

/* ============ 내 주변 ============ */
function nearMe(auto){
  if(!navigator.geolocation){
    toast("이 브라우저는 위치 기능을 지원하지 않습니다");
    if(!started) showIntro("denied");
    return;
  }
  if(!started){
    $("listItems").innerHTML = '<div class="empty">위치를 확인하는 중…</div>';
  }
  if(!auto) toast("위치를 확인하는 중…");

  navigator.geolocation.getCurrentPosition(function(pos){
    here = [pos.coords.latitude, pos.coords.longitude];
    nearMode = true;
    setNearActive(true);
    if(S.favOnly){ refresh(); }

    var best = null, bestD = Infinity;
    IDX.regions.forEach(function(rg){
      if(!rg.center) return;
      var d = distKm(here[0], here[1], rg.center[0], rg.center[1]);
      if(d < bestD){ bestD = d; best = rg; }
    });
    if(!best){ toast("가까운 지역을 찾지 못했습니다"); if(!started) showIntro("prompt"); return; }

    if(S.favOnly){
      toast("저장한 곳을 가까운 순으로 정렬했습니다");
      return;
    }
    S.sgg = "";
    if(S.sido !== best.slug || !started){
      loadRegion(best.slug);
    }else{
      updateRegionLabel();
      refresh();
    }
    toast(best.name + " 기준 가까운 순으로 정렬했습니다");
  }, function(err){
    setNearActive(false);
    var denied = err.code === 1;
    toast(denied ? "위치 권한이 거부되었습니다. 지역을 골라주세요."
                 : "위치를 가져오지 못했습니다. 지역을 골라주세요.");
    // 회복 경로 — 토스트 한 줄로 끝내지 않고 지역 선택으로 이어준다.
    if(!started) showIntro(denied ? "denied" : "prompt");
  }, { enableHighAccuracy:false, timeout:10000, maximumAge:300000 });
}

/* 자동 QA에서 내부 상태를 확인하기 위한 읽기 전용 훅 */
window.__gymfinder = {
  map: function(){ return map; },
  view: function(){ return view; },
  index: function(){ return IDX; },
  state: function(){
    return { sido:S.sido, sgg:S.sgg, openOnly:S.openOnly, phoneOnly:S.phoneOnly,
             favOnly:S.favOnly, favCount:loadFavs().length, standalone:isStandalone(),
             nearMode:nearMode, here:here, started:started, layer:layerOpen };
  }
};

initTheme();
if("serviceWorker" in navigator){
  window.addEventListener("load", function(){
    navigator.serviceWorker.register("sw.js").catch(function(){});
  });
}
})();
</script>
