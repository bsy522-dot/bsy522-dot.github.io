<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>헬스장파인더 — 전국 헬스장·수영장 위치와 영업상태</title>
<meta name="description" content="행정안전부 인허가 데이터로 만든 전국 체력단련장·수영장·종합체육시설 디렉토리. 시도·시군구별 위치, 영업/휴업/폐업 상태를 지도와 목록으로 확인합니다.">
<meta name="theme-color" content="#0f172a">
<meta name="color-scheme" content="dark light">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta property="og:type" content="website">
<meta property="og:title" content="헬스장파인더 — 전국 헬스장·수영장 위치와 영업상태">
<meta property="og:description" content="행정안전부 인허가 데이터 기반 전국 체력단련장·수영장 디렉토리">
<link rel="stylesheet" href="vendor/leaflet.css">
<style>
  :root{
    --bg:#0b1220; --surface:#111a2b; --surface-2:#17233a; --line:#243352;
    --fg:#e8eefc; --fg-dim:#9fb0d0; --fg-mute:#6d7f9f;
    --accent:#34d399; --accent-fg:#052e1b; --accent-soft:rgba(52,211,153,.14);
    --open:#34d399; --rest:#fbbf24; --closed:#f87171; --void:#94a3b8;
    --radius:14px; --shadow:0 8px 28px rgba(0,0,0,.38);
  }
  html[data-theme="light"]{
    --bg:#f4f7fb; --surface:#ffffff; --surface-2:#eef3fa; --line:#d8e2f0;
    --fg:#101a2c; --fg-dim:#4a5b76; --fg-mute:#7c8aa3;
    --accent:#0f9d63; --accent-fg:#ffffff; --accent-soft:rgba(15,157,99,.12);
    --open:#0f9d63; --rest:#b7791f; --closed:#d64545; --void:#8494ab;
    --shadow:0 8px 24px rgba(16,26,44,.10);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:var(--bg); color:var(--fg);
    font-family:-apple-system,BlinkMacSystemFont,"Malgun Gothic","맑은 고딕",
      "Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;
    font-size:15px; line-height:1.5; -webkit-text-size-adjust:100%;
  }
  button,select,input{font:inherit; color:inherit}
  button{cursor:pointer}

  /* ---------- header ---------- */
  header{
    position:sticky; top:0; z-index:600; background:var(--surface);
    border-bottom:1px solid var(--line); padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px)*0);
  }
  .bar{display:flex; align-items:center; gap:10px}
  .brand{display:flex; flex-direction:column; align-items:flex-start; gap:0; min-width:0}
  .brand h1{margin:0; font-size:18px; font-weight:800; letter-spacing:-.02em; white-space:nowrap}
  .brand .dot{color:var(--accent)}
  .brand small{color:var(--fg-mute); font-size:11px; white-space:nowrap;
    overflow:hidden; text-overflow:ellipsis; max-width:100%}
  @media (min-width:900px){
    .brand{flex-direction:row; align-items:baseline; gap:9px}
  }
  .spacer{flex:1}
  .icon-btn{
    background:var(--surface-2); border:1px solid var(--line); color:var(--fg-dim);
    border-radius:10px; width:36px; height:36px; display:grid; place-items:center; font-size:15px;
  }
  .icon-btn:hover{color:var(--fg); border-color:var(--accent)}

  /* ---------- filters ---------- */
  .filters{display:flex; flex-wrap:wrap; gap:8px; margin-top:9px}
  .field{position:relative; flex:1 1 140px; min-width:0; max-width:300px}
  .field.search{flex:1 1 100%; order:-1; max-width:none}
  @media (min-width:900px){
    .field.search{flex:1 1 300px; order:0; max-width:420px}
  }
  select,input[type="search"]{
    width:100%; background:var(--surface-2); border:1px solid var(--line);
    color:var(--fg); border-radius:10px; padding:9px 11px; outline:none; min-width:0;
    -webkit-appearance:none; appearance:none;
  }
  select{background-image:linear-gradient(45deg,transparent 50%,var(--fg-mute) 50%),
    linear-gradient(135deg,var(--fg-mute) 50%,transparent 50%);
    background-position:calc(100% - 16px) 17px, calc(100% - 11px) 17px;
    background-size:5px 5px,5px 5px; background-repeat:no-repeat; padding-right:30px}
  input[type="search"]::-webkit-search-cancel-button{filter:invert(.5)}
  select:focus,input:focus{border-color:var(--accent)}
  .chips{display:flex; gap:6px; flex-wrap:nowrap; margin-top:8px;
    overflow-x:auto; scrollbar-width:none; -ms-overflow-style:none; padding-bottom:1px}
  .chips::-webkit-scrollbar{display:none}
  @media (min-width:900px){ .chips{flex-wrap:wrap; overflow:visible} }
  .chip{
    background:var(--surface-2); border:1px solid var(--line); color:var(--fg-dim);
    border-radius:999px; padding:5px 12px; font-size:13px; white-space:nowrap;
  }
  .chip[aria-pressed="true"]{background:var(--accent-soft); border-color:var(--accent); color:var(--accent)}
  .chip .cnt{opacity:.65; font-size:11px; margin-left:4px}

  .summary{
    display:flex; align-items:center; gap:8px; margin-top:9px;
    font-size:12.5px; color:var(--fg-dim); flex-wrap:wrap;
  }
  .summary b{color:var(--fg); font-variant-numeric:tabular-nums}
  .viewtabs{display:none; gap:6px; margin-left:auto}
  .viewtabs .chip{padding:5px 14px}

  /* ---------- layout ---------- */
  main{display:grid; grid-template-columns:1fr; height:calc(100vh - var(--head,208px)); min-height:340px}
  @media (min-width:900px){ main{grid-template-columns:minmax(360px,42%) 1fr} }
  .pane{min-height:0; overflow:hidden; display:flex; flex-direction:column}
  #listPane{border-right:1px solid var(--line)}
  #mapPane{position:relative}
  #map{position:absolute; inset:0; background:var(--surface-2)}
  .maphint{
    position:absolute; left:56px; right:10px; top:10px; z-index:500;
    background:var(--surface); border:1px solid var(--line); border-radius:10px;
    padding:7px 11px; font-size:12px; color:var(--fg-dim); box-shadow:var(--shadow);
  }
  @media (max-width:899px){
    main{grid-template-columns:1fr}
    .viewtabs{display:flex}
    #mapPane{display:none}
    body[data-view="map"] #listPane{display:none}
    body[data-view="map"] #mapPane{display:flex}
  }

  /* ---------- list ---------- */
  .listwrap{overflow-y:auto; -webkit-overflow-scrolling:touch; padding:10px 12px 40px; flex:1}
  .card{
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
    padding:11px 13px; margin-bottom:8px; display:block; width:100%; text-align:left;
  }
  .card:hover{border-color:var(--accent)}
  .card.active{border-color:var(--accent); background:var(--accent-soft)}
  .card .top{display:flex; align-items:center; gap:7px; margin-bottom:4px}
  .card .name{font-weight:700; font-size:15px; letter-spacing:-.01em;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .badge{font-size:11px; padding:2px 7px; border-radius:999px; white-space:nowrap; flex:none;
    border:1px solid currentColor; font-weight:600}
  .b-open{color:var(--open)} .b-rest{color:var(--rest)}
  .b-closed{color:var(--closed)} .b-void{color:var(--void)}
  .card .addr{font-size:12.5px; color:var(--fg-dim); overflow:hidden;
    text-overflow:ellipsis; white-space:nowrap}
  .card .meta{font-size:11.5px; color:var(--fg-mute); margin-top:3px;
    display:flex; gap:8px; flex-wrap:wrap}
  .empty{text-align:center; color:var(--fg-mute); padding:48px 16px; font-size:14px}
  .empty b{display:block; color:var(--fg-dim); margin-bottom:6px; font-size:15px}
  .more{width:100%; padding:11px; border-radius:10px; background:var(--surface-2);
    border:1px solid var(--line); color:var(--fg-dim); margin-top:4px}

  /* ---------- detail sheet ---------- */
  .scrim{position:fixed; inset:0; background:rgba(3,7,16,.55); z-index:900; display:none}
  .scrim.on{display:block}
  .sheet{
    position:fixed; z-index:901; background:var(--surface); border:1px solid var(--line);
    box-shadow:var(--shadow); display:none; overflow-y:auto;
    left:0; right:0; bottom:0; max-height:82vh; border-radius:18px 18px 0 0;
    padding:16px 16px calc(22px + env(safe-area-inset-bottom,0px));
  }
  .sheet.on{display:block}
  @media (min-width:900px){
    .sheet{left:50%; right:auto; top:50%; bottom:auto; transform:translate(-50%,-50%);
      width:min(520px,92vw); max-height:82vh; border-radius:16px}
  }
  .sheet h2{margin:0 0 4px; font-size:19px; letter-spacing:-.02em; padding-right:36px}
  .sheet .close{position:absolute; top:12px; right:12px}
  .kv{display:grid; grid-template-columns:78px 1fr; gap:7px 10px; margin:14px 0 0; font-size:14px}
  .kv dt{color:var(--fg-mute); font-size:12.5px; padding-top:1px}
  .kv dd{margin:0; word-break:break-word}
  .links{display:flex; gap:8px; flex-wrap:wrap; margin-top:16px}
  .links a{
    flex:1 1 auto; text-align:center; text-decoration:none; padding:10px 12px; border-radius:10px;
    background:var(--surface-2); border:1px solid var(--line); color:var(--fg-dim); font-size:13.5px;
  }
  .links a.primary{background:var(--accent); border-color:var(--accent); color:var(--accent-fg); font-weight:700}
  .notice{
    margin-top:14px; padding:10px 12px; border-radius:10px; font-size:12.5px;
    background:var(--surface-2); border:1px solid var(--line); color:var(--fg-mute); line-height:1.55;
  }
  footer{
    border-top:1px solid var(--line); padding:14px 16px 26px; font-size:12px;
    color:var(--fg-mute); background:var(--surface); line-height:1.6;
  }
  footer a{color:var(--fg-dim)}
  .toast{
    position:fixed; left:50%; bottom:22px; transform:translateX(-50%); z-index:950;
    background:var(--surface); border:1px solid var(--line); color:var(--fg);
    padding:9px 16px; border-radius:999px; font-size:13px; box-shadow:var(--shadow);
    opacity:0; pointer-events:none; transition:opacity .18s;
  }
  .toast.on{opacity:1}
  .leaflet-container{background:var(--surface-2); font:inherit}
  .leaflet-popup-content-wrapper,.leaflet-popup-tip{
    background:var(--surface); color:var(--fg); border:1px solid var(--line)}
  .leaflet-popup-content{margin:10px 12px; font-size:13px}
  .leaflet-popup-content b{display:block; margin-bottom:3px}
  .leaflet-bar a{background:var(--surface); color:var(--fg); border-color:var(--line)}
  .leaflet-bar a:hover{background:var(--surface-2)}
</style>
</head>
<body data-view="list">

<header>
  <div class="bar">
    <div class="brand">
      <h1>헬스장<span class="dot">파인더</span></h1>
      <small id="dataStamp">데이터 불러오는 중…</small>
    </div>
    <div class="spacer"></div>
    <button class="icon-btn" id="nearBtn" title="내 주변에서 찾기" aria-label="내 주변에서 찾기">◎</button>
    <button class="icon-btn" id="themeBtn" title="밝기 전환" aria-label="밝기 전환">◐</button>
  </div>

  <div class="filters">
    <div class="field search">
      <input type="search" id="q" placeholder="시설명 검색 (초성 검색 가능 — 예: ㅅㅍㅊ)"
             autocomplete="off" aria-label="시설명 검색">
    </div>
    <div class="field"><select id="sido" aria-label="시도 선택"></select></div>
    <div class="field"><select id="sigungu" aria-label="시군구 선택"><option value="">시군구 전체</option></select></div>
  </div>

  <div class="chips" id="catChips" role="group" aria-label="업종 필터"></div>

  <div class="summary">
    <span id="countLine">—</span>
    <button class="chip" id="statusToggle" aria-pressed="true">영업중만</button>
    <div class="viewtabs" role="group" aria-label="보기 전환">
      <button class="chip" id="tabList" aria-pressed="true">목록</button>
      <button class="chip" id="tabMap" aria-pressed="false">지도</button>

  </div>
</header>

<main>
  <section class="pane" id="listPane">
    <div class="listwrap" id="listWrap"><div class="empty">불러오는 중…</div></div>
  </section>
  <section class="pane" id="mapPane">

    <div class="maphint" id="mapHint" hidden></div>
  </section>
</main>

<script src="vendor/leaflet.js"></script>
<script>
(function(){
"use strict";

/* ============ 상태 ============ */
var IDX = null;                 // index.json
var CACHE = {};                 // slug -> 시설 배열
var rows = [];                  // 현재 시도의 전체 배열
var view = [];                  // 필터 통과분
var shown = 0;                  // 목록에 그린 개수
var PAGE = 40;
var MAX_MARKERS = 2500;
var activeId = null;
var here = null;                // 내 위치 [lat,lng]
var map = null, layer = null, meMarker = null;

var STATUS_CLASS = {1:"b-open", 2:"b-rest", 3:"b-closed", 4:"b-void", 5:"b-void"};

var $ = function(id){ return document.getElementById(id); };
var esc = function(s){
  return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
  });
};
var fmt = function(n){ return Number(n).toLocaleString("ko-KR"); };

/* 원본 전화번호는 구분기호 없이 들어온다(예: 025867721). 숫자는 그대로 두고 보기 좋게만 끊는다. */
function fmtPhone(p){
  var d = String(p).replace(/[^0-9]/g, "");
  if(d.slice(0, 2) === "02"){
    if(d.length === 9)  return d.slice(0,2) + "-" + d.slice(2,5) + "-" + d.slice(5);
    if(d.length === 10) return d.slice(0,2) + "-" + d.slice(2,6) + "-" + d.slice(6);
  }
  if(d.length === 10) return d.slice(0,3) + "-" + d.slice(3,6) + "-" + d.slice(6);
  if(d.length === 11) return d.slice(0,3) + "-" + d.slice(3,7) + "-" + d.slice(7);
  // 지역번호 없이 등록된 국번(7~8자리)도 읽기 쉽게 끊어준다
  if(d.length === 8)  return d.slice(0,4) + "-" + d.slice(4);
  if(d.length === 7)  return d.slice(0,3) + "-" + d.slice(3);
  return p;
}

/* ============ 초성 검색 ============ */
var CHO = ["ㄱ","ㄲ","ㄴ","ㄷ","ㄸ","ㄹ","ㅁ","ㅂ","ㅃ","ㅅ","ㅆ","ㅇ","ㅈ","ㅉ","ㅊ","ㅋ","ㅌ","ㅍ","ㅎ"];
function toCho(s){
  var out = "", i, c;
  for(i = 0; i < s.length; i++){
    c = s.charCodeAt(i);
    if(c >= 0xAC00 && c <= 0xD7A3) out += CHO[Math.floor((c - 0xAC00) / 588)];
    else out += s[i];
  }
  return out;
}
var CHO_ONLY = /^[ㄱ-ㅎ\s]+$/;

/* ============ 거리 ============ */
function distKm(a, b, c, d){
  var R = 6371, p = Math.PI / 180;
  var dLat = (c - a) * p, dLng = (d - b) * p;
  var h = Math.sin(dLat/2)*Math.sin(dLat/2) +
          Math.cos(a*p)*Math.cos(c*p)*Math.sin(dLng/2)*Math.sin(dLng/2);
  return 2 * R * Math.asin(Math.min(1, Math.sqrt(h)));
}

/* ============ 토스트 ============ */
var toastT = null;
function toast(msg){
  var el = $("toast");
  el.textContent = msg;
  el.classList.add("on");
  clearTimeout(toastT);
  toastT = setTimeout(function(){ el.classList.remove("on"); }, 2600);
}

/* ============ 테마 ============ */
function initTheme(){
  var saved = null;
  try{ saved = localStorage.getItem("gf.theme"); }catch(e){}
  if(!saved){
    saved = (window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches)
      ? "light" : "dark";
  }
  setTheme(saved);
}
function setTheme(t){
  document.documentElement.setAttribute("data-theme", t);
  document.querySelector('meta[name="theme-color"]')
    .setAttribute("content", t === "light" ? "#ffffff" : "#0f172a");
  try{ localStorage.setItem("gf.theme", t); }catch(e){}
}
$("themeBtn").addEventListener("click", function(){
  setTheme(document.documentElement.getAttribute("data-theme") === "light" ? "dark" : "light");
});

/* ============ 헤더 높이 -> 본문 높이 ============ */
function syncHeight(){
  var h = document.querySelector("header").offsetHeight;
  document.documentElement.style.setProperty("--head", h + "px");
  document.querySelector("main").style.height = "calc(100vh - " + h + "px)";
  if(map) map.invalidateSize();
}
window.addEventListener("resize", syncHeight);

/* ============ 부트 ============ */
fetch("data/index.json")
  .then(function(r){
    if(!r.ok) throw new Error("index.json " + r.status);
    return r.json();
  })
  .then(function(j){ IDX = j; boot(); })
  .catch(function(e){
    $("listWrap").innerHTML =
      '<div class="empty"><b>데이터를 불러오지 못했습니다</b>' + esc(e.message) + "</div>";
  });

function boot(){
  $("dataStamp").textContent =
    "전국 " + fmt(IDX.total) + "곳 · 기준 " + (IDX.sourceUpdatedAt || "").slice(0, 10);

  // 업종 칩
  var chips = $("catChips");
  IDX.categories.forEach(function(name, i){
    var b = document.createElement("button");
    b.className = "chip";
    b.dataset.cat = i;
    b.setAttribute("aria-pressed", "true");
    b.innerHTML = esc(name) + '<span class="cnt">' + fmt(IDX.byCategory[i].total) + "</span>";
    b.addEventListener("click", function(){
      var on = b.getAttribute("aria-pressed") === "true";
      // 마지막 하나는 끄지 못하게
      if(on && chips.querySelectorAll('[aria-pressed="true"]').length === 1) return;
      b.setAttribute("aria-pressed", on ? "false" : "true");
      refresh();
    });
    chips.appendChild(b);
  });

  // 시도
  var sel = $("sido");
  IDX.regions.forEach(function(r){
    var o = document.createElement("option");
    o.value = r.slug;
    o.textContent = r.name + " (" + fmt(r.open) + ")";
    sel.appendChild(o);
  });
  var last = null;
  try{ last = localStorage.getItem("gf.sido"); }catch(e){}
  sel.value = (last && IDX.regions.some(function(r){ return r.slug === last; }))
    ? last : IDX.regions[0].slug;

  sel.addEventListener("change", function(){
    try{ localStorage.setItem("gf.sido", sel.value); }catch(e){}
    loadRegion(sel.value);
  });
  $("sigungu").addEventListener("change", refresh);
  $("statusToggle").addEventListener("click", function(){
    var b = $("statusToggle");
    var on = b.getAttribute("aria-pressed") === "true";
    b.setAttribute("aria-pressed", on ? "false" : "true");
    b.textContent = on ? "전체 상태" : "영업중만";
    refresh();
  });

  var t = null;
  $("q").addEventListener("input", function(){
    clearTimeout(t);
    t = setTimeout(refresh, 160);
  });

  $("tabList").addEventListener("click", function(){ setView("list"); });
  $("tabMap").addEventListener("click", function(){ setView("map"); });
  $("nearBtn").addEventListener("click", nearMe);
  $("scrim").addEventListener("click", closeSheet);
  document.addEventListener("keydown", function(e){ if(e.key === "Escape") closeSheet(); });

  initMap();
  loadRegion(sel.value);
  syncHeight();
}

function setView(v){
  document.body.dataset.view = v;
  $("tabList").setAttribute("aria-pressed", String(v === "list"));
  $("tabMap").setAttribute("aria-pressed", String(v === "map"));
  if(v === "map" && map){
    // 지도 패널이 숨겨진 동안에는 크기가 0이라 범위 계산이 어긋난다.
    // 보이게 된 뒤에 크기를 다시 재고 밀린 fitBounds 를 적용한다.
    setTimeout(function(){ map.invalidateSize(); applyFit(); }, 40);
  }
}

/* ============ 지도 ============ */
function initMap(){
  map = L.map("map", { preferCanvas:true, zoomControl:true, attributionControl:true })
        .setView([36.5, 127.8], 7);
  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom: 19,
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
  }).addTo(map);
  layer = L.layerGroup().addTo(map);
}

var STATUS_COLOR = {1:"#34d399", 2:"#fbbf24", 3:"#f87171", 4:"#94a3b8", 5:"#94a3b8"};

var pendingFit = null;
function mapVisible(){
  var el = $("mapPane");
  return !!(el.offsetWidth && el.offsetHeight);
}
function applyFit(){
  if(!pendingFit || !pendingFit.length || !map) return;
  map.fitBounds(pendingFit, {
    padding: [26, 26],
    maxZoom: pendingFit.length === 1 ? 16 : 15
  });
  pendingFit = null;
}

function drawMap(){
  if(!map) return;
  layer.clearLayers();
  var pts = view.filter(function(r){ return r.y != null; });
  var capped = pts.length > MAX_MARKERS;
  var use = capped ? pts.slice(0, MAX_MARKERS) : pts;
  var bounds = [];

  use.forEach(function(r){
    var m = L.circleMarker([r.y, r.x], {
      radius: 5, weight: 1.5, color: STATUS_COLOR[r.s] || "#94a3b8",
      fillColor: STATUS_COLOR[r.s] || "#94a3b8", fillOpacity: .55
    });
    m.bindPopup("<b>" + esc(r.n) + "</b>" + esc(r.a));
    m.on("click", function(){ openSheet(r); });
    m.addTo(layer);
    bounds.push([r.y, r.x]);
  });

  var hint = $("mapHint");
  var noCoord = view.length - pts.length;
  var msgs = [];
  if(capped) msgs.push("지도에는 " + fmt(MAX_MARKERS) + "곳까지만 표시합니다. 지역·검색을 좁혀보세요.");
  if(noCoord > 0) msgs.push("원본에 좌표가 없는 " + fmt(noCoord) + "곳은 목록에만 나옵니다.");
  if(msgs.length){ hint.textContent = msgs.join(" "); hint.hidden = false; }
  else hint.hidden = true;

  if(bounds.length){
    pendingFit = bounds;
    if(mapVisible()) applyFit();
  }
  if(here){
    if(meMarker) map.removeLayer(meMarker);
    meMarker = L.circleMarker(here, {
      radius:8, weight:3, color:"#3b82f6", fillColor:"#3b82f6", fillOpacity:.35
    }).bindPopup("내 위치").addTo(map);
  }
}

/* ============ 지역 로드 ============ */
function loadRegion(slug){
  var reg = IDX.regions.filter(function(r){ return r.slug === slug; })[0];
  $("listWrap").innerHTML = '<div class="empty">' + esc(reg ? reg.name : "") + " 불러오는 중…</div>";

  var done = function(arr){
    rows = arr;
    fillSigungu(reg);
    refresh();
  };
  if(CACHE[slug]) return done(CACHE[slug]);

  fetch("data/regions/" + slug + ".json")
    .then(function(r){
      if(!r.ok) throw new Error(slug + ".json " + r.status);
      return r.json();
    })
    .then(function(arr){ CACHE[slug] = arr; done(arr); })
    .catch(function(e){
      $("listWrap").innerHTML =
        '<div class="empty"><b>지역 데이터를 불러오지 못했습니다</b>' + esc(e.message) + "</div>";
    });
}

function fillSigungu(reg){
  var sel = $("sigungu");
  sel.innerHTML = '<option value="">시군구 전체</option>';
  if(!reg) return;
  reg.sigungu.forEach(function(s){
    var o = document.createElement("option");
    o.value = s.name;
    o.textContent = s.name + " (" + fmt(s.open) + ")";
    sel.appendChild(o);
  });
}

/* ============ 필터 ============ */
function refresh(){
  var q = $("q").value.trim();
  var sgg = $("sigungu").value;
  var openOnly = $("statusToggle").getAttribute("aria-pressed") === "true";
  var cats = {};
  Array.prototype.forEach.call($("catChips").children, function(b){
    if(b.getAttribute("aria-pressed") === "true") cats[b.dataset.cat] = 1;
  });

  var isCho = q && CHO_ONLY.test(q);
  var needle = q.toLowerCase().replace(/\s+/g, "");
  var choNeedle = isCho ? q.replace(/\s+/g, "") : "";

  view = rows.filter(function(r){
    if(!cats[r.c]) return false;
    if(openOnly && r.s !== 1) return false;
    if(sgg && r.u !== sgg) return false;
    if(!q) return true;
    if(isCho) return toCho(r.n).replace(/\s+/g, "").indexOf(choNeedle) >= 0;
    return r.n.toLowerCase().replace(/\s+/g, "").indexOf(needle) >= 0 ||
           r.a.toLowerCase().indexOf(needle) >= 0;
  });

  if(here){
    view.forEach(function(r){
      r._d = (r.y == null) ? Infinity : distKm(here[0], here[1], r.y, r.x);
    });
    view.sort(function(a, b){ return a._d - b._d; });
  }

  var open = 0, i;
  for(i = 0; i < view.length; i++) if(view[i].s === 1) open++;
  $("countLine").innerHTML = "<b>" + fmt(view.length) + "</b>곳" +
    (openOnly ? "" : " · 영업중 <b>" + fmt(open) + "</b>");

  shown = 0;
  $("listWrap").innerHTML = "";
  $("listWrap").scrollTop = 0;
  renderMore();
  drawMap();
}

function statusLabel(r){
  return (IDX.statusLabels && IDX.statusLabels[r.s]) || "확인필요";
}

function renderMore(){
  var wrap = $("listWrap");
  var old = wrap.querySelector(".more");
  if(old) old.remove();

  if(!view.length){
    wrap.innerHTML = '<div class="empty"><b>조건에 맞는 시설이 없습니다</b>' +
      "검색어를 줄이거나 상태 필터를 ‘전체 상태’로 바꿔보세요.</div>";
    return;
  }

  var frag = document.createDocumentFragment();
  var end = Math.min(shown + PAGE, view.length);
  for(var i = shown; i < end; i++){
    var r = view[i];
    var b = document.createElement("button");
    b.className = "card" + (r.i === activeId ? " active" : "");
    b.dataset.idx = i;
    var meta = [IDX.categories[r.c]];
    if(r._d != null && isFinite(r._d)) meta.push(r._d.toFixed(1) + "km");
    if(r.y == null) meta.push("좌표없음");
    if(r.p) meta.push(fmtPhone(r.p));
    b.innerHTML =
      '<div class="top"><span class="name">' + esc(r.n) + "</span>" +
      '<span class="badge ' + STATUS_CLASS[r.s] + '">' + esc(statusLabel(r)) + "</span></div>" +
      '<div class="addr">' + esc(r.a) + "</div>" +
      '<div class="meta">' + meta.map(function(m){ return esc(m); }).join(" · ") + "</div>";
    b.addEventListener("click", function(){ openSheet(view[+this.dataset.idx]); });
    frag.appendChild(b);
  }
  wrap.appendChild(frag);
  shown = end;

  if(shown < view.length){
    var more = document.createElement("button");
    more.className = "more";
    more.textContent = "더 보기 (" + fmt(view.length - shown) + "곳 남음)";
    more.addEventListener("click", renderMore);
    wrap.appendChild(more);
  }
}

$("listWrap").addEventListener("scroll", function(){
  var el = this;
  if(shown < view.length && el.scrollTop + el.clientHeight > el.scrollHeight - 260) renderMore();
});

/* ============ 상세 ============ */
function openSheet(r){
  if(!r) return;
  activeId = r.i;
  var mapq = encodeURIComponent(r.n + " " + r.a);
  var rows_ = [
    ["업종", IDX.categories[r.c]],
    ["영업상태", statusLabel(r) + (r.e ? " (" + r.e + ")" : "")],
    ["주소", r.a],
    ["시군구", r.u]
  ];
  if(r.p) rows_.push(["전화", '<a href="tel:' + esc(r.p) + '">' + esc(fmtPhone(r.p)) + "</a>"]);
  if(r.d) rows_.push(["인허가일", r.d]);
  if(r._d != null && isFinite(r._d)) rows_.push(["내 위치에서", r._d.toFixed(1) + "km"]);
  rows_.push(["관리번호", r.i]);

  var links =
    '<a class="primary" href="https://map.kakao.com/?q=' + mapq + '" target="_blank" rel="noopener">카카오맵</a>' +
    '<a href="https://map.naver.com/p/search/' + mapq + '" target="_blank" rel="noopener">네이버지도</a>' +
    '<a href="https://www.google.com/maps/search/?api=1&query=' + mapq + '" target="_blank" rel="noopener">구글맵</a>';

  $("sheet").innerHTML =
    '<button class="icon-btn close" id="sheetClose" aria-label="닫기">✕</button>' +
    '<h2 id="sheetName">' + esc(r.n) + "</h2>" +
    '<span class="badge ' + STATUS_CLASS[r.s] + '">' + esc(statusLabel(r)) + "</span>" +
    '<dl class="kv">' + rows_.map(function(kv){
      return "<dt>" + esc(kv[0]) + "</dt><dd>" +
        (kv[0] === "전화" ? kv[1] : esc(kv[1])) + "</dd>";
    }).join("") + "</dl>" +
    '<div class="links">' + links + "</div>" +
    '<div class="notice">이용료·운영시간·시설·평점 정보는 행정안전부 인허가 데이터에 없어 표시하지 않습니다. ' +
    "영업상태는 지자체 신고 기준이라 실제와 다를 수 있으니 방문 전 확인하세요." +
    (r.y == null ? " 이 시설은 원본에 좌표가 없어 지도에 표시되지 않습니다." : "") + "</div>";

  $("sheetClose").addEventListener("click", closeSheet);
  $("sheet").classList.add("on");
  $("scrim").classList.add("on");
  $("sheet").scrollTop = 0;

  Array.prototype.forEach.call(document.querySelectorAll(".card"), function(c){
    c.classList.toggle("active", view[+c.dataset.idx] && view[+c.dataset.idx].i === r.i);
  });
  if(r.y != null && map && document.body.dataset.view === "map"){
    map.setView([r.y, r.x], Math.max(map.getZoom(), 15));
  }
}
function closeSheet(){
  $("sheet").classList.remove("on");
  $("scrim").classList.remove("on");
}

/* ============ 내 주변 ============ */
function nearMe(){
  if(!navigator.geolocation){ toast("이 브라우저는 위치 기능을 지원하지 않습니다"); return; }
  toast("위치를 확인하는 중…");
  navigator.geolocation.getCurrentPosition(function(pos){
    here = [pos.coords.latitude, pos.coords.longitude];
    var best = null, bestD = Infinity;
    IDX.regions.forEach(function(rg){
      if(!rg.center) return;
      var d = distKm(here[0], here[1], rg.center[0], rg.center[1]);
      if(d < bestD){ bestD = d; best = rg; }
    });
    if(!best){ toast("가까운 지역을 찾지 못했습니다"); return; }
    toast(best.name + " 기준으로 가까운 순 정렬");
    if($("sido").value !== best.slug){
      $("sido").value = best.slug;
      try{ localStorage.setItem("gf.sido", best.slug); }catch(e){}
      $("sigungu").value = "";
      loadRegion(best.slug);
    }else{
      $("sigungu").value = "";
      refresh();
    }
  }, function(err){
    toast(err.code === 1 ? "위치 권한이 거부되었습니다" : "위치를 가져오지 못했습니다");
  }, { enableHighAccuracy:false, timeout:10000, maximumAge:300000 });
}

/* 자동 QA에서 내부 상태를 확인하기 위한 읽기 전용 훅 */
window.__gymfinder = {
  map: function(){ return map; },
  view: function(){ return view; },
  index: function(){ return IDX; }
};

initTheme();
if("serviceWorker" in navigator){
  window.addEventListener("load", function(){
    navigator.serviceWorker.register("sw.js").catch(function(){});
  });
}
})();
</script>
